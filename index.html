  // ---- Sync with Google Drive ----
  // Your data is kept in a hidden app folder in your own Google Drive (drive.appdata scope:
  // only this app can see it). Each device merges its copy with Drive's piece by piece, so
  // logging on two devices the same day keeps both. Sign-in uses Google's token flow; the
  // access token lasts about an hour, after which a tap reconnects.
  const GOOGLE_CLIENT_ID = "573379670688-4cn4m6pk01d5p6a35brmm4gvmmhtv9cd.apps.googleusercontent.com";
  const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
  const DRIVE = "https://www.googleapis.com";
  const SYNC_FILE = "habits-sync.json";
  const SYNC_KEY = "habit-tracker-sync";
  const SYNC_EVERY = 3 * 60 * 1000;
  // Arrays whose items have ids are merged item by item; any other array is merged whole.
  const ID_ARRAYS = new Set(["/habits", "/spending/entries", "/spending/favorites", "/spending/recurring",
    "/weight/entries", "/trading/firms", "/trading/payouts", "/trading/costs"]);

  // Device-only sync settings and change times (not part of backups).
  let sync = loadSync();
  function loadSync() {
    try { return { enabled: false, stamps: {}, ...(JSON.parse(localStorage.getItem(SYNC_KEY)) || {}) }; }
    catch { return { enabled: false, stamps: {} }; }
  }
  function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch {} }
  const tokenValid = () => sync.token && Date.now() < (sync.tokenExp || 0);
  let syncStatus = { state: "idle", error: "" }; // idle | syncing | error

  // Flattens data into { "/path": json } leaves so two copies can be compared and merged.
  function flatten(value, path = "", out = {}) {
    if (Array.isArray(value) && ID_ARRAYS.has(path)) {
      out[`${path}/#order`] = JSON.stringify(value.map(v => v.id));
      for (const v of value) flatten(v, `${path}/@${encodeURIComponent(v.id)}`, out);
    } else if (value && typeof value === "object" && !Array.isArray(value)) {
      for (const [k, v] of Object.entries(value)) flatten(v, `${path}/${encodeURIComponent(k)}`, out);
    } else out[path] = JSON.stringify(value);
    return out;
  }
  function unflatten(flat) {
    const root = {};
    for (const [path, json] of Object.entries(flat)) {
      const parts = path.split("/").slice(1);
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) node = (node[parts[i]] ??= {});
      node[parts[parts.length - 1]] = JSON.parse(json);
    }
    const convert = node => {
      if (!node || typeof node !== "object" || Array.isArray(node)) return node;
      if ("#order" in node) {
        const items = {};
        // An item without its id leaf was deleted somewhere; leftover edits don't bring it back.
        for (const [k, v] of Object.entries(node)) if (k[0] === "@" && v && "id" in v) items[decodeURIComponent(k.slice(1))] = convert(v);
        const order = node["#order"] || [];
        return [...order.filter(id => id in items), ...Object.keys(items).filter(id => !order.includes(id))].map(id => items[id]);
      }
      const out = {};
      for (const [k, v] of Object.entries(node)) out[decodeURIComponent(k)] = convert(v);
      return out;
    };
    return convert(root);
  }

  // Records when each piece changed (or was deleted), so the newer side wins when merging.
  function noteChange(prevSnap, nextSnap) {
    if (!sync.enabled) return;
    const a = flatten(JSON.parse(prevSnap)), b = flatten(JSON.parse(nextSnap));
    const now = Date.now();
    for (const p of new Set([...Object.keys(a), ...Object.keys(b)])) if (a[p] !== b[p]) sync.stamps[p] = now;
    saveSync();
    syncSoon();
  }

  // Newer change wins per piece; pieces only one side has are kept; on a tie Drive's copy wins.
  function mergeFlat(lf, ls, rf, rs) {
    const flat = {}, stamps = {};
    for (const p of new Set([...Object.keys(lf), ...Object.keys(rf), ...Object.keys(ls), ...Object.keys(rs)])) {
      const lt = ls[p] || 0, rt = rs[p] || 0;
      const from = lt > rt ? "l" : rt > lt ? "r" : p in rf ? "r" : "l";
      const v = from === "l" ? lf[p] : rf[p];
      if (v !== undefined) flat[p] = v;
      if (lt || rt) stamps[p] = Math.max(lt, rt);
    }
    return { flat, stamps };
  }

  // Replaces local data with the merged copy (no Undo, no change stamps — it came from sync).
  function applyMerged(m) {
    habits = (m.habits || []).map(h => ({ ...h, done: h.done || {} }));
    work = { rates: [], hours: {}, ...(m.work || {}) };
    spending = normalizeSpending(m.spending);
    weight = { weighDay: 1, goal: null, entries: [], ...(m.weight || {}) };
    trading = normalizeTrading(m.trading);
    monthly = normalizeMonthly(m.monthly);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
      localStorage.setItem(WORK_KEY, JSON.stringify(work));
      localStorage.setItem(SPEND_KEY, JSON.stringify(spending));
      localStorage.setItem(WEIGHT_KEY, JSON.stringify(weight));
      localStorage.setItem(TRADING_KEY, JSON.stringify(trading));
      localStorage.setItem(MONTHLY_KEY, JSON.stringify(monthly));
    } catch {}
    lastState = snapshot();
    if (undo) { clearTimeout(undo.timer); hideToast(); }
    editing = null; weightView.editId = null;
    render(); renderWeight(); renderWork(); renderTrading(); renderSpending(); renderGoalLine();
    if (checkinIsOpen()) renderCheckin();
  }

  // ---- Drive requests ----
  async function driveFetch(url, opts = {}) {
    const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${sync.token}` } });
    if (r.status === 401 || r.status === 403) { sync.token = null; saveSync(); throw new Error("auth"); }
    if (!r.ok) { const e = new Error(`Drive error ${r.status}`); e.status = r.status; throw e; }
    return r;
  }
  async function driveList(q) {
    const r = await driveFetch(`${DRIVE}/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=files(id,name)&q=${encodeURIComponent(q + " and trashed=false")}`);
    return (await r.json()).files || [];
  }
  async function driveCreate(name, content, mime) {
    const b = `habits${Date.now()}`;
    const body = new Blob([
      `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name, parents: ["appDataFolder"] })}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`,
      content, `\r\n--${b}--`]);
    const r = await driveFetch(`${DRIVE}/upload/drive/v3/files?uploadType=multipart&fields=id`, {
      method: "POST", headers: { "Content-Type": `multipart/related; boundary=${b}` }, body });
    return (await r.json()).id;
  }
  const driveUpdate = (id, content, mime) => driveFetch(`${DRIVE}/upload/drive/v3/files/${id}?uploadType=media`, { method: "PATCH", headers: { "Content-Type": mime }, body: content });
  const driveDownload = id => driveFetch(`${DRIVE}/drive/v3/files/${id}?alt=media`);
  const driveDelete = id => driveFetch(`${DRIVE}/drive/v3/files/${id}`, { method: "DELETE" });

  async function readRemote() {
    if (!sync.fileId) sync.fileId = (await driveList(`name='${SYNC_FILE}'`))[0]?.id || null;
    if (!sync.fileId) return null;
    try { return await (await driveDownload(sync.fileId)).json(); }
    catch (e) {
      if (e.status !== 404) throw e;
      sync.fileId = null; // the file was removed; look it up again next time
      return readRemote();
    }
  }

  // ---- The sync cycle ----
  let syncing = false, syncAgain = false, syncTimer = null, lastPhotoSync = 0;
  function syncSoon() {
    clearTimeout(syncTimer);
    if (sync.enabled) syncTimer = setTimeout(syncNow, 4000);
  }

  async function syncNow() {
    if (!sync.enabled) return; // only possible after signing in
    if (!tokenValid()) { renderSyncStatus(); return; }
    if (!navigator.onLine) { renderSyncStatus(); return; }
    if (syncing) { syncAgain = true; return; }
    syncing = true;
    syncStatus = { state: "syncing", error: "" };
    renderSyncStatus();
    try {
      const startSnap = snapshot();
      const local = JSON.parse(startSnap);
      const remote = await readRemote();
      const lf = flatten(local);
      // First sync on this device with data already in Drive: entries only one side has are
      // always kept; this decides which side wins where the two disagree.
      if (sync.firstMerge) {
        if (remote?.data && confirm("Your Google Drive already has habit data from another device.\n\n" +
            "OK — this device is more up to date (its entries win where they differ)\n" +
            "Cancel — the other device is more up to date")) {
          const now = Date.now();
          for (const p of Object.keys(lf)) sync.stamps[p] = now;
        }
        sync.firstMerge = false;
      }
      let flat = lf, stamps = sync.stamps;
      if (remote?.data) ({ flat, stamps } = mergeFlat(lf, sync.stamps, flatten(remote.data), remote.stamps || {}));
      // Something changed while Drive was being read: start over so it isn't lost.
      if (snapshot() !== startSnap) { syncAgain = true; return; }
      const merged = unflatten(flat);
      const mergedFlat = flatten(merged);
      const differs = (a, b) => Object.keys(a).length !== Object.keys(b).length || Object.keys(a).some(k => a[k] !== b[k]);
      if (differs(lf, mergedFlat)) applyMerged(merged);
      sync.stamps = stamps;
      const remoteFlat = remote?.data ? flatten(remote.data) : null;
      if (!remoteFlat || differs(remoteFlat, flatten(JSON.parse(snapshot()))) || JSON.stringify(remote.stamps || {}) !== JSON.stringify(stamps)) {
        const body = JSON.stringify({ version: 1, updatedAt: Date.now(), data: JSON.parse(snapshot()), stamps });
        if (sync.fileId) await driveUpdate(sync.fileId, body, "application/json");
        else sync.fileId = await driveCreate(SYNC_FILE, body, "application/json");
      }
      if (Date.now() - lastPhotoSync > 5 * 60 * 1000) { await syncPhotos(); lastPhotoSync = Date.now(); }
      sync.lastSync = Date.now();
      saveSync();
      syncStatus = { state: "idle", error: "" };
    } catch (e) {
      syncStatus = { state: "error", error: e.message === "auth" ? "" : e.message || "Sync failed" };
    } finally {
      syncing = false;
      renderSyncStatus();
      if (syncAgain) { syncAgain = false; syncSoon(); }
    }
  }

  // Photos: one file per month; the newer photo for a month wins. Deleting a photo only
  // removes it from this device (it would come back from Drive), so delete on each device.
  async function syncPhotos() {
    let local;
    try { local = await getPhotos(); } catch { return; } // no IndexedDB here
    const remote = {};
    for (const f of await driveList("name contains 'photo-'")) {
      const m = f.name.match(/^photo-(\d{4}-\d{2})_(\d{4}-\d{2}-\d{2})\.jpg$/);
      if (m && (!remote[m[1]] || remote[m[1]].date < m[2])) remote[m[1]] = { id: f.id, date: m[2], old: remote[m[1]] };
    }
    for (const p of local) {
      const r = remote[p.month];
      if (!r || r.date < p.date) {
        await driveCreate(`photo-${p.month}_${p.date}.jpg`, p.blob, "image/jpeg");
        if (r) await driveDelete(r.id).catch(() => {});
      }
    }
    for (const [month, r] of Object.entries(remote)) {
      const l = local.find(p => p.month === month);
      if (!l || l.date < r.date) await putPhoto({ month, date: r.date, blob: await (await driveDownload(r.id)).blob() });
    }
  }

  // ---- Google sign-in ----
  let tokenClient = null;
  function loadGis() {
    return new Promise((resolve, reject) => {
      if (window.google?.accounts?.oauth2) { resolve(); return; }
      const s = document.createElement("script");
      s.src = "https://accounts.google.com/gsi/client";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("Couldn't reach Google — check your connection."));
      document.head.append(s);
    });
  }
  // Must run straight from a tap so the Google window isn't blocked.
  function requestToken(first) {
    if (!window.google?.accounts?.oauth2) {
      loadGis().then(renderSyncStatus).catch(e => { syncStatus = { state: "error", error: e.message }; renderSyncStatus(); });
      syncStatus = { state: "error", error: "Loading Google sign-in… tap again in a moment." };
      renderSyncStatus();
      return;
    }
    tokenClient = tokenClient || google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: r => {
        if (r.error) { syncStatus = { state: "error", error: "Google sign-in didn't finish." }; renderSyncStatus(); return; }
        sync.token = r.access_token;
        sync.tokenExp = Date.now() + (Number(r.expires_in) - 60) * 1000;
        // First connection on this device: the first sync asks which copy is newer.
        if (!sync.enabled) { sync.firstMerge = true; sync.stamps = {}; }
        sync.enabled = true;
        saveSync();
        syncNow();
      },
      error_callback: () => { syncStatus = { state: "error", error: "Google sign-in was closed." }; renderSyncStatus(); }
    });
    tokenClient.requestAccessToken({ prompt: first ? "consent" : "" });
  }

  function disconnectSync() {
    if (!confirm("Stop syncing on this device? Your data stays here and in your Google Drive.")) return;
    try { if (sync.token) google.accounts.oauth2.revoke(sync.token, () => {}); } catch {}
    sync = { enabled: false, stamps: {} };
    saveSync();
    syncStatus = { state: "idle", error: "" };
    renderSyncStatus();
  }

  function agoText(t) {
    const m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
  }

  function renderSyncStatus() {
    const card = document.getElementById("syncCard");
    const chip = document.getElementById("syncChip");
    if (!card) return;
    const status = document.getElementById("syncStatus");
    const btns = document.getElementById("syncBtns");
    btns.innerHTML = "";
    const button = (text, fn, primary) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = text;
      if (primary) b.className = "primary";
      b.onclick = fn;
      btns.append(b);
    };
    let chipText = "";
    if (!GOOGLE_CLIENT_ID) {
      status.textContent = "Sync isn't set up yet.";
    } else if (!sync.enabled) {
      status.textContent = "Keep your phone and computer in step through your own Google Drive.";
      button("Connect Google Drive", () => requestToken(true), true);
    } else if (!tokenValid()) {
      status.textContent = `Paused — tap to reconnect.${sync.lastSync ? ` Last synced ${agoText(sync.lastSync)}.` : ""}`;
      button("Reconnect", () => requestToken(false), true);
      button("Disconnect", disconnectSync);
      chipText = "☁️ Tap to sync";
    } else {
      status.textContent = syncStatus.state === "syncing" ? "Syncing…"
        : syncStatus.state === "error" ? `Couldn't sync: ${syncStatus.error}`
        : !navigator.onLine ? "Offline — will sync when you're back online."
        : sync.lastSync ? `✓ Synced ${agoText(sync.lastSync)}` : "Connected.";
      button("Sync now", syncNow);
      button("Disconnect", disconnectSync);
      if (syncStatus.state === "error") chipText = "☁️ Sync problem";
    }
    if (syncStatus.state === "error" && syncStatus.error && !tokenValid() && sync.enabled) status.textContent += ` (${syncStatus.error})`;
    chip.hidden = !chipText;
    chip.textContent = chipText;
  }

  // ---- Backups ----
  const LAST_EXPORT_KEY = "habit-tracker-last-export";
  const BACKUP_DISMISS_KEY = "habit-tracker-backup-dismissed";
  const getPref = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  // "Everything" includes progress photos (as images inside the file); "Without photos" is much smaller.
  async function exportData(withPhotos = true) {
    const data = { habits, work, spending, weight, trading, monthly };
    if (withPhotos) {
      try { data.photos = await Promise.all((await getPhotos()).map(async p => ({ month: p.month, date: p.date, data: await blobToDataUrl(p.blob) }))); }
      catch { data.photos = []; }
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `habits-${dayKey(new Date())}${withPhotos ? "" : "-no-photos"}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    setPref(LAST_EXPORT_KEY, dayKey(startOfToday()));
    renderBackupBanner();
  }
  document.getElementById("exportBtn").onclick = async () => {
    let n = 0;
    try { n = (await getPhotos()).length; } catch {}
    document.getElementById("exportPhotoCount").textContent = n ? `${n} photo${n === 1 ? "" : "s"}` : "no photos yet";
    document.getElementById("exportDialog").showModal();
  };
  document.getElementById("exportAll").onclick = () => { document.getElementById("exportDialog").close(); exportData(true); };
  document.getElementById("exportLite").onclick = () => { document.getElementById("exportDialog").close(); exportData(false); };
  document.getElementById("exportCancel").onclick = () => document.getElementById("exportDialog").close();

  // Nudge to back up when the last export is over 7 days old (or never happened).
  function renderBackupBanner() {
    const el = document.getElementById("backupBanner");
    const todayKey = dayKey(startOfToday());
    const last = getPref(LAST_EXPORT_KEY);
    const age = last ? daysBetween(fromKey(last), startOfToday()) : null;
    if ((age !== null && age <= 7) || getPref(BACKUP_DISMISS_KEY) === todayKey) { el.hidden = true; return; }
    el.hidden = false;
    document.getElementById("backupText").textContent =
      age === null ? "You haven't backed up yet" : `Last backup: ${age} days ago`;
  }
  document.getElementById("backupNow").onclick = () => exportData(true);
  document.getElementById("backupDismiss").onclick = () => {
    setPref(BACKUP_DISMISS_KEY, dayKey(startOfToday()));
    renderBackupBanner();
  };

  // Ask the browser not to clear this site's storage when space runs low.
  async function protectStorage() {
    const el = document.getElementById("storageStatus");
    if (!navigator.storage?.persist) { el.textContent = "This browser doesn't offer storage protection — keep regular backups."; return; }
    try {
      const ok = (await navigator.storage.persisted()) || (await navigator.storage.persist());
      el.textContent = ok ? "🔒 Storage protection is on — the browser won't clear your data to free up space."
        : "Storage protection wasn't granted (installing the app usually turns it on) — keep regular backups.";
    } catch { el.textContent = ""; }
  }

  // ---- Undo ----
  // After each change, the state from just before it is kept for a few seconds so it can be put back.
  const snapshot = () => JSON.stringify({ habits, work, spending, weight, trading, monthly });
  let lastState;      // state as of the most recent save
  let undo = null;    // { snap, label, mergeKey, timer }

  function commit(label = "Change saved", mergeKey) {
    if (lastState === undefined) return; // still starting up
    const now = snapshot();
    if (now === lastState) return;
    const prev = lastState;
    lastState = now;
    noteChange(prev, now); // for sync
    // Repeated edits to the same thing (like typing hours) undo together.
    if (!(undo && mergeKey && undo.mergeKey === mergeKey)) {
      clearTimeout(undo?.timer);
      undo = { snap: prev, mergeKey };
    }
    undo.label = label;
    showUndoToast();
  }

  function showUndoToast() {
    const toast = document.getElementById("toast");
    document.getElementById("toastText").textContent = undo.label;
    toast.hidden = false;
    clearTimeout(undo.timer);
    undo.timer = setTimeout(hideToast, 5000);
  }
  function hideToast() {
    document.getElementById("toast").hidden = true;
    undo = null;
  }

  function restore(s) {
    habits = s.habits; work = s.work; spending = s.spending; weight = s.weight; trading = s.trading; monthly = s.monthly;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
      localStorage.setItem(WORK_KEY, JSON.stringify(work));
      localStorage.setItem(SPEND_KEY, JSON.stringify(spending));
      localStorage.setItem(WEIGHT_KEY, JSON.stringify(weight));
      localStorage.setItem(TRADING_KEY, JSON.stringify(trading));
      localStorage.setItem(MONTHLY_KEY, JSON.stringify(monthly));
    } catch {}
    editing = null; weightView.editId = null;
    render(); renderWeight(); renderWork(); renderTrading(); renderSpending(); renderGoalLine();
  }

  document.getElementById("toastUndo").onclick = () => {
    if (!undo) return;
    const snap = undo.snap, cur = lastState;
    clearTimeout(undo.timer);
    restore(JSON.parse(snap));
    lastState = snap;
    noteChange(cur, snap); // an undo is a change too, for sync
    hideToast();
  };
  document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      // Older exports are a bare array of habits with no work hours.
      const data = JSON.parse(await file.text());
      const imported = Array.isArray(data) ? { habits: data } : data;
      if (!Array.isArray(imported.habits)) throw new Error();
      // Preview what gets replaced: what you have now → what's in the file.
      const n = (k, one, many) => `${k} ${k === 1 ? one : many}`;
      const lines = [
        `• ${n(habits.length, "habit", "habits")} → ${imported.habits.length}`,
        imported.work && `• ${n(Object.keys(work.hours).length, "work day", "work days")} → ${Object.keys(imported.work.hours || {}).length}`,
        imported.spending && `• ${n(spending.entries.length, "purchase", "purchases")} → ${(imported.spending.entries || []).length}`,
        imported.weight && `• ${n(weight.entries.length, "weigh-in", "weigh-ins")} → ${(imported.weight.entries || []).length}`,
        imported.monthly && `• ${n(Object.keys(monthly.months).length, "month of goals", "months of goals")} → ${Object.keys(imported.monthly.months || {}).length}`,
        Array.isArray(imported.photos) && `• progress photos → ${imported.photos.length} (photos can't be undone)`,
        imported.trading && `• ${n(Object.keys(trading.days).length, "trading day", "trading days")}, ${n(trading.payouts.length + trading.costs.length, "payout/cost", "payouts/costs")} → ${Object.keys(imported.trading.days || {}).length}, ${(imported.trading.payouts || []).length + (imported.trading.costs || []).length}`
      ].filter(Boolean);
      const missing = [!imported.work && "work hours", !imported.spending && "spending", !imported.weight && "weigh-ins", !imported.trading && "trading",
        !imported.monthly && "monthly goals", !Array.isArray(imported.photos) && "photos"].filter(Boolean);
      const msg = `This will replace what you have now with the backup file:\n\n${lines.join("\n")}` +
        (missing.length ? `\n\nNot in this file, so left as they are: ${missing.join(", ")}.` : "") +
        "\n\nContinue?";
      if (confirm(msg)) {
        // One Undo covers the whole import.
        habits = imported.habits; save("Imported backup", "import"); render();
        if (imported.work) { work = imported.work; saveWork("Imported backup", "import"); renderWork(); }
        if (imported.spending) { spending = normalizeSpending(imported.spending); saveSpending("Imported backup", "import"); renderSpending(); }
        if (imported.weight) { weight = { weighDay: 1, goal: null, entries: [], ...imported.weight }; saveWeight("Imported backup", "import"); renderWeight(); }
        if (imported.trading) { trading = normalizeTrading(imported.trading); saveTrading("Imported backup", "import"); renderTrading(); }
        if (imported.monthly) { monthly = normalizeMonthly(imported.monthly); saveMonthly("Imported backup", "import"); renderGoalLine(); }
        if (Array.isArray(imported.photos)) {
          try {
            await clearPhotos();
            for (const ph of imported.photos) await putPhoto({ month: ph.month, date: ph.date, blob: await dataUrlToBlob(ph.data) });
          } catch { alert("Your data was imported, but the photos couldn't be saved in this browser view."); }
        }
      }
    } catch { alert("That file doesn't look like a habit tracker export."); }
    e.target.value = "";
  };

  // ---- Reminders ----
  // A web page can only notify while it's open (a tab, or the installed app in the
  // background), so these are best-effort nudges, not alarms.
  const REM_KEY = "habit-tracker-reminders";
  let reminders = (() => {
    try { return JSON.parse(localStorage.getItem(REM_KEY)) || {}; } catch { return {}; }
  })();
  const saveReminders = () => { try { localStorage.setItem(REM_KEY, JSON.stringify(reminders)); } catch {} };

  function setupReminders() {
    const bed = document.getElementById("remBed");
    const checkin = document.getElementById("remCheckin");
    const time = document.getElementById("remCheckinTime");
    bed.checked = !!reminders.bed;
    checkin.checked = !!reminders.checkin;
    time.value = reminders.checkinTime || "21:00";
    const update = async () => {
      if ((bed.checked || checkin.checked) && "Notification" in window && Notification.permission === "default") {
        try { await Notification.requestPermission(); } catch {}
      }
      Object.assign(reminders, { bed: bed.checked, checkin: checkin.checked, checkinTime: time.value || "21:00" });
      saveReminders(); reminderStatus();
    };
    bed.onchange = checkin.onchange = time.onchange = update;
    reminderStatus();
  }

  function reminderStatus() {
    const el = document.getElementById("remStatus");
    if (!reminders.bed && !reminders.checkin) { el.textContent = "Reminders show while this page or the installed app is open."; return; }
    if (!("Notification" in window)) el.textContent = "This browser can't show notifications — you'll get a banner on the page instead.";
    else if (Notification.permission === "denied") el.textContent = "Notifications are blocked for this page, so you'll get a banner on the page instead.";
    else if (Notification.permission === "default") el.textContent = "Allow notifications when asked, or you'll only see a banner on the page.";
    else el.textContent = "On ✓ — reminders show while this page or the installed app is open.";
  }

  async function notify(title, body, openTheCheckin = false) {
    let shown = false;
    if ("Notification" in window && Notification.permission === "granted") {
      try {
        // Phones only allow notifications through the service worker.
        const reg = "serviceWorker" in navigator && await navigator.serviceWorker.getRegistration();
        if (reg) await reg.showNotification(title, { body, icon: "icon-192.png", data: { checkin: !!openTheCheckin } });
        else new Notification(title, { body, icon: "icon-192.png" });
        shown = true;
      } catch {}
    }
    if (!shown || document.visibilityState === "visible") showBanner(`${title} — ${body}`, openTheCheckin);
  }

  function showBanner(text, openTheCheckin = false) {
    let b = document.getElementById("banner");
    if (!b) {
      b = document.createElement("div");
      b.id = "banner";
      document.body.append(b);
    }
    // The evening check-in banner opens the check-in when tapped.
    b.onclick = () => { b.remove(); if (openTheCheckin) openCheckin(); };
    b.textContent = text + (openTheCheckin ? "  — tap to check in" : "  ✕");
  }

  function checkReminders() {
    const now = new Date();
    const todayKey = dayKey(now);
    const nowMin = now.getHours() * 60 + now.getMinutes();
    let fired;
    try { fired = JSON.parse(localStorage.getItem("habit-tracker-fired")) || {}; } catch { fired = {}; }
    if (fired.day !== todayKey) fired = { day: todayKey, sent: [] };
    // Fire within 10 minutes of the time, once a day, so a sleeping laptop catches up briefly but not hours later.
    const due = (t, id) => !fired.sent.includes(id) && nowMin >= t && nowMin < t + 10;
    const send = (id, title, body) => {
      fired.sent.push(id);
      try { localStorage.setItem("habit-tracker-fired", JSON.stringify(fired)); } catch {}
      notify(title, body, id === "checkin");
    };

    const bedHabit = habits.find(h => h.sleep === "bed");
    if (reminders.bed && bedHabit?.time) {
      const t = (toMin(bedHabit.time) - 30 + 1440) % 1440;
      if (due(t, "bed")) send("bed", "Bedtime in 30 minutes", `Aim to be in bed by ${shortClock(bedHabit.time)}.`);
    }
    if (reminders.checkin && reminders.checkinTime) {
      if (due(toMin(reminders.checkinTime), "checkin")) {
        // Sleep and screen time can't be finished in the evening, so they're left out.
        // Weekly habits are listed only when today is needed to still make the week's goal.
        const left = habits.filter(h => dayState(h, todayKey) === "missed" && !h.sleep && !h.screen).map(h => h.name);
        if (weighInDueToday()) left.push("Weigh-in");
        const risky = streaksAtRisk();
        const body = [
          risky.length && risky.map(riskText).join(" "),
          left.length && `Still to do today: ${left.join(", ")}.`
        ].filter(Boolean).join(" ");
        if (body) send("checkin", risky.length ? "⏳ Streak check-in" : "Habit check-in", body);
      }
    }
  }

  setupReminders();

  // Offline support and "Add to Home Screen" once the app is served from a web address
  // (service workers don't run for files opened straight from disk).
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  // Re-render after midnight so "Today" stays correct if the tab is left open.
  setInterval(() => {
    const k = dayKey(new Date());
    if (k !== render.lastDay) {
      render.lastDay = k;
      // New day: add any bills that just came due.
      if (runRecurring(spending)) { try { localStorage.setItem(SPEND_KEY, JSON.stringify(spending)); } catch {} lastState = snapshot(); }
      render(); renderWeight(); renderWork(); renderTrading(); renderSpending(); renderGoalLine();
      maybePromptMonth();
    }
    checkReminders();
    renderLastChance(); // appears at 8 PM without needing a tap
  }, 30_000);
  render.lastDay = dayKey(new Date());
  // Journal dialog: changes save when you tap Save, switch days, or close it.
  const journalDialog = document.getElementById("journalDialog");
  // Save right away on close (the close event itself arrives a moment later).
  const closeJournal = () => { saveJournalEntry(); journalDialog.close(); };
  document.getElementById("journalClose").onclick = closeJournal;
  journalDialog.oncancel = e => { e.preventDefault(); closeJournal(); }; // Esc key
  journalDialog.onclick = e => { if (e.target === journalDialog) closeJournal(); };
  document.getElementById("journalSave").onclick = () => {
    const changed = saveJournalEntry();
    document.getElementById("journalSaved").textContent = changed ? "Saved ✓" : "No changes";
    renderJournalSearch();
  };
  document.getElementById("journalText").oninput = () => { document.getElementById("journalSaved").textContent = ""; };
  document.getElementById("journalDate").onchange = e => {
    if (!e.target.value) return;
    saveJournalEntry();
    journalKey = e.target.value > dayKey(startOfToday()) ? dayKey(startOfToday()) : e.target.value;
    renderJournal();
  };
  document.getElementById("journalSearch").oninput = renderJournalSearch;

  const checkinDialog = document.getElementById("checkinDialog");
  document.getElementById("checkinBtn").onclick = openCheckin;
  document.getElementById("checkinClose").onclick = document.getElementById("checkinDone").onclick = () => checkinDialog.close();
  checkinDialog.onclose = () => render();
  // Opened from the evening reminder: ?checkin in the address, or a message from the service worker.
  if (new URLSearchParams(location.search).has("checkin")) setTimeout(openCheckin, 0);
  navigator.serviceWorker?.addEventListener("message", e => { if (e.data?.type === "open-checkin") openCheckin(); });

  document.getElementById("updateBanner").onclick = () => location.reload();
  setTimeout(checkForUpdate, 5000);
  setInterval(checkForUpdate, 30 * 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });

  document.getElementById("resetDayBtn").onclick = resetToday;
  document.getElementById("syncChip").onclick = () => tokenValid() ? syncNow() : requestToken(false);
  // Sync: on open, a few seconds after each change (see noteChange), every few minutes,
  // when the app comes back to the front or goes to the back, and when back online.
  if (GOOGLE_CLIENT_ID) loadGis().then(renderSyncStatus).catch(() => {});
  setTimeout(syncNow, 1500);
  setInterval(() => { if (document.visibilityState === "visible") syncNow(); }, SYNC_EVERY);
  setInterval(renderSyncStatus, 60 * 1000); // keeps "synced X min ago" current
  document.addEventListener("visibilitychange", () => syncNow());
  window.addEventListener("online", syncNow);
  renderSyncStatus();

  const lbDialog = document.getElementById("lbDialog");
  document.getElementById("lookbackBtn").onclick = openLookback;
  document.getElementById("lbClose").onclick = () => lbDialog.close();
  document.querySelectorAll("#lbRanges button").forEach(b => b.onclick = () => {
    lbView.range = b.dataset.range;
    if (lbView.range === "custom" && !lbView.from) {
      const [f, t] = lbRange.call(null);
      lbView.from = dayKey(addDays(fromKey(t), -29)); lbView.to = t;
      document.getElementById("lbFrom").value = lbView.from; document.getElementById("lbTo").value = lbView.to;
    }
    renderLookback();
  });
  for (const id of ["lbFrom", "lbTo"]) document.getElementById(id).onchange = () => {
    lbView.from = document.getElementById("lbFrom").value; lbView.to = document.getElementById("lbTo").value;
    if (lbView.from && lbView.to && lbView.from <= lbView.to) renderLookback();
  };

  const monthDialog = document.getElementById("monthDialog");
  document.getElementById("monthSave").onclick = saveMonthDialog;
  document.getElementById("monthSkip").onclick = document.getElementById("monthClose").onclick = skipMonthDialog;
  monthDialog.oncancel = e => { e.preventDefault(); skipMonthDialog(); };
  const photosDialog = document.getElementById("photosDialog");
  document.getElementById("photosBtn").onclick = openPhotos;
  document.getElementById("photosClose").onclick = () => photosDialog.close();
  photosDialog.onclick = e => { if (e.target === photosDialog) photosDialog.close(); };

  const tradingDialog = document.getElementById("tradingDialog");
  document.getElementById("tradingClose").onclick = () => tradingDialog.close();
  tradingDialog.onclick = e => { if (e.target === tradingDialog) tradingDialog.close(); };
  document.querySelectorAll("#tradingTabs button").forEach(b => b.onclick = () => { tradingView.tab = b.dataset.tab; renderTradingDialog(); });

  const csvDialog = document.getElementById("csvDialog");
  document.getElementById("csvClose").onclick = document.getElementById("csvCancel").onclick = () => csvDialog.close();
  document.getElementById("csvConfirm").onclick = confirmCsv;
  const badgesDialog = document.getElementById("badgesDialog");
  document.getElementById("badgesBtn").onclick = () => { renderBadges(); badgesDialog.showModal(); };
  document.getElementById("badgesClose").onclick = () => badgesDialog.close();
  badgesDialog.onclick = e => { if (e.target === badgesDialog) badgesDialog.close(); };
  document.getElementById("lastChanceDismiss").onclick = () => {
    setPref(LAST_CHANCE_DISMISS_KEY, dayKey(startOfToday()));
    renderLastChance();
  };

  render();
  renderWeight();
  renderWork();
  renderTrading();
  renderSpending();
  renderGoalLine();
  // Ask for the month's goal and photo once a month (after any check-in opened from a reminder).
  if (!new URLSearchParams(location.search).has("checkin")) setTimeout(maybePromptMonth, 300);
  renderBackupBanner();
  protectStorage();
  lastState = snapshot();
</script>
</body>
</html>
