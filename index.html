<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --border: #e3e6eb;
    --empty: #eceef2;
    --accent: #16a34a;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --card: #1b1f27;
      --text: #e8eaee;
      --muted: #9aa1ad;
      --border: #2b303a;
      --empty: #262b35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; }
  .today { color: var(--muted); }

  .summary { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
  .stat {
    flex: 1 1 140px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px;
  }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }

  form.add { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit;
  }
  input[type=color] {
    width: 44px; height: 42px; padding: 2px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); cursor: pointer;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); padding: 9px 14px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; font-size: 13px; }
  button.link:hover { color: var(--text); }
  button.link.danger:hover { color: var(--danger); }

  .habit {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .habit-top { display: flex; align-items: center; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .name { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .streak { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .goal-time { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .goal-time input {
    font: inherit; color: var(--text); background: var(--empty); border: 1px solid var(--border);
    border-radius: 8px; padding: 3px 6px; color-scheme: light dark;
  }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0 8px; }
  .day {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 0; border: none; background: none;
  }
  .day small { color: var(--muted); font-size: 11px; }
  .check {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    background: var(--empty); color: transparent; font-weight: 700; transition: transform .1s;
  }
  .day:active .check { transform: scale(.9); }
  .day.done .check { color: #fff; }
  .check.partial { font-size: 11px; }
  .check.timed { font-size: 10px; letter-spacing: -.3px; }
  .note-dot { width: 5px; height: 5px; border-radius: 50%; }
  .day.selected .check { outline: 2px solid var(--text); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 12px; margin: -2px 0 6px; }
  .info { font-size: 13px; margin: 6px 0 4px; }
  .editor {
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; margin: 6px 0 10px; display: grid; gap: 8px;
  }
  .editor-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .editor input, .editor select {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; color-scheme: light dark;
  }
  .editor input[type=text] { flex: 1; min-width: 140px; }
  .editor input.mins { width: 90px; }
  .editor button { padding: 6px 14px; }
  .recent-notes { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
  .recent-notes b { color: var(--text); }
  .day.is-today small { color: var(--text); font-weight: 600; }

  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 10px); gap: 3px; margin-top: 6px; overflow-x: auto; }
  .heat i { width: 10px; height: 10px; border-radius: 2px; background: var(--empty); }
  .habit-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .rate { color: var(--muted); font-size: 13px; }

  .rate-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; color: var(--muted); font-size: 13px; }
  .rate-row input, .hours-input {
    font: inherit; color: var(--text); background: var(--empty); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; color-scheme: light dark;
  }
  .rate-row input[type=number] { width: 90px; }
  .rate-row button { padding: 5px 12px; font-size: 13px; }
  .hours-input { width: 100%; max-width: 56px; text-align: center; padding: 6px 2px; }
  .work-totals { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .work-totals div { flex: 1 1 120px; background: var(--empty); border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--muted); }
  .work-totals b { display: block; color: var(--text); font-size: 16px; }
  .work-totals .sub { font-size: 11px; }
  .rate-row select {
    font: inherit; color: var(--text); background: var(--empty); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; color-scheme: light dark;
  }
  .week-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; }
  .week-nav button:disabled { visibility: hidden; }

  #reminders input[type=checkbox] { width: 16px; height: 16px; vertical-align: -3px; accent-color: var(--accent); }
  .sync-card { margin-top: 18px; }
  .sync-chip { font-size: 12px; color: #d97706; padding: 0; }
  .reset-day { display: block; padding: 4px 0 0; font-size: 12px; }
  .update-banner {
    display: block; width: 100%; margin-bottom: 14px; padding: 10px 14px; border: none; border-radius: 10px;
    background: #4f46e5; color: #fff; font-weight: 700; font-size: 14px; text-align: left;
  }
  .update-banner[hidden] { display: none; }
  .backup-banner {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 14px;
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid #f59e0b;
    border-radius: 10px; padding: 6px 8px 6px 12px; font-size: 13px;
  }
  .backup-banner[hidden] { display: none; }
  .backup-banner #backupNow { color: var(--text); font-weight: 600; text-decoration: underline; }
  .backup-banner #backupDismiss { margin-left: auto; }
  .toast {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20;
    width: min(480px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px;
    /* Always dark so the green Undo reads well in both themes. */
    background: #111827; color: #f9fafb; border: 1px solid #374151; padding: 10px 10px 10px 16px; border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35); font-size: 14px;
  }
  .toast[hidden] { display: none; }
  .toast span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .toast button { background: none; border: none; color: #4ade80; font-weight: 700; padding: 6px 10px; }
  /* Reminder banners sit at the top so they don't cover the Undo toast. */
  #banner {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 10;
    width: min(560px, calc(100% - 32px)); background: var(--text); color: var(--bg);
    padding: 12px 16px; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }

  .spend-note { flex: 1 1 160px; padding: 5px 8px !important; font-size: 13px; }
  .work-totals .sub.over { color: var(--danger); }
  .budget-bar { height: 8px; border-radius: 4px; background: var(--empty); overflow: hidden; margin: 10px 0 4px; }
  .budget-bar i { display: block; height: 100%; border-radius: 4px; }
  .cat-list { display: grid; gap: 4px; margin-top: 10px; font-size: 13px; }
  .cat { display: grid; grid-template-columns: 80px 1fr auto; gap: 8px; align-items: center; }
  .cat-bar { height: 8px; background: var(--empty); border-radius: 4px; overflow: hidden; }
  .cat-bar i { display: block; height: 100%; background: #be123c; border-radius: 4px; }
  .spend-list { margin-top: 12px; font-size: 13px; display: grid; gap: 2px; }
  .spend-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; color: var(--muted); }
  .spend-row span:first-child { overflow-wrap: anywhere; }
  .spend-row span:nth-child(2) { color: var(--text); font-variant-numeric: tabular-nums; }

  .goal-time select {
    font: inherit; color: var(--text); background: var(--empty); border: 1px solid var(--border);
    border-radius: 8px; padding: 3px 4px; color-scheme: light dark;
  }
  .habit-top { flex-wrap: wrap; }
  .water-glass { flex-basis: 100%; padding-left: 22px; }
  .water-row { display: flex; gap: 8px; margin: 2px 0 8px; }
  .water-row button { min-width: 44px; font-size: 18px; padding: 6px 12px; }
  .water-row button:disabled { opacity: .4; cursor: default; }
  .water-row .water-plus { flex: 1; font-size: 15px; }
  .day { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  .weight-chart { width: 100%; height: auto; display: block; margin: 12px 0 4px; }
  .weight-chart text { font-size: 10px; fill: var(--muted); }
  .weight-row { grid-template-columns: 1fr auto auto auto; }
  .due { color: var(--danger); font-weight: 600; }
  .muted { color: var(--muted); }

  select.freq {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 0 6px; color-scheme: light dark; flex: none;
  }
  .heat-wrap { overflow-x: auto; margin-top: 6px; padding-bottom: 4px; scrollbar-width: thin; }
  .heat-inner { width: max-content; }
  .heat-wrap .heat { overflow: visible; margin-top: 2px; }
  .heat-months { display: grid; column-gap: 3px; height: 14px; font-size: 10px; color: var(--muted); white-space: nowrap; }
  .excuse-row label { display: flex; align-items: center; gap: 6px; }
  .excuse-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .editor input[type=color] { width: 44px; height: 36px; padding: 2px; }

  .stat-btn { text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .stat-btn:hover { border-color: var(--muted); }
  .stat.perfect { border-color: #f59e0b; background: linear-gradient(135deg, rgba(245,158,11,.14), transparent 70%), var(--card); }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

  .last-chance {
    margin-bottom: 14px; background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--danger);
    border-radius: 10px; padding: 8px 8px 8px 12px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start;
  }
  .last-chance[hidden] { display: none; }
  .last-chance div { flex: 1; display: grid; gap: 2px; }
  .last-chance b { color: var(--danger); }

  dialog.badges {
    width: min(560px, calc(100% - 32px)); max-height: calc(100% - 48px); border: 1px solid var(--border);
    border-radius: 16px; padding: 0; background: var(--card); color: var(--text);
  }
  dialog.badges::backdrop { background: rgba(0,0,0,.45); }
  .badges-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
  .badges-head h2 { margin: 0; font-size: 18px; }
  .badges-body { padding: 8px 16px 16px; }
  .badge-group { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .badge-group:last-child { border-bottom: none; }
  .badge-group h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; background: var(--empty); color: var(--muted); }
  .badge.earned { background: rgba(245,158,11,.16); color: var(--text); font-weight: 600; }
  .badge small { font-weight: 400; color: var(--muted); }
  .badge-next { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .badge-next .bar { height: 6px; border-radius: 3px; background: var(--empty); overflow: hidden; margin-top: 4px; }
  .badge-next .bar i { display: block; height: 100%; border-radius: 3px; }

  .celebrate { position: fixed; inset: 0; pointer-events: none; z-index: 30; display: grid; place-items: center; overflow: hidden; }
  .celebrate .pop {
    background: #111827; color: #f9fafb; border: 1px solid #374151; border-radius: 16px; padding: 16px 22px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.35); animation: pop .35s ease-out;
  }
  .celebrate .pop b { display: block; font-size: 20px; }
  .celebrate .pop span { font-size: 13px; color: #d1d5db; }
  .celebrate i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .celebrate i { display: none; } .celebrate .pop { animation: none; } }

  .favs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .favs:empty { display: none; }
  .fav { padding: 5px 12px; border-radius: 999px; font-size: 13px; }
  .fav.on { border-color: #be123c; box-shadow: inset 0 0 0 1px #be123c; }
  .spend-streaks { display: grid; gap: 2px; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .spend-streaks b { color: var(--text); }
  .cat .over { color: var(--danger); font-weight: 600; }
  .spend-more { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .spend-more summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 4px 0; }
  .bars { width: 100%; height: auto; display: block; margin-top: 6px; }
  .bars text { font-size: 9px; fill: var(--muted); }
  .moves { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; margin-top: 4px; }
  .bill-row { grid-template-columns: 1fr auto auto; }
  .bill-row small { color: var(--muted); }
  .bill-form { margin-top: 10px; }
  .limits { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; font-size: 13px; }
  .limits label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .limits input { width: 76px; font: inherit; color: var(--text); background: var(--empty); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; color-scheme: light dark; }
  .dialog-foot { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; background: var(--card); border-top: 1px solid var(--border); }
  .csv-errors { font-size: 12px; color: var(--danger); margin: 8px 0; }
  .csv-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .csv-row.dim .csv-main, .csv-row.dim .csv-amt { color: var(--muted); }
  .csv-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .csv-amt { font-variant-numeric: tabular-nums; }
  .csv-flag { grid-column: 2 / -1; color: #d97706; font-size: 12px; }
  .csv-choice { grid-column: 2 / -1; display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; }

  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .checkin-btn { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .q-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin: 2px 0 8px; }
  .q-text { font-size: 14px; }
  .q-btns { display: inline-flex; gap: 6px; }
  .q-btn { min-width: 58px; padding: 7px 12px; font-weight: 600; }
  .q-btn.on.good { background: var(--accent); border-color: var(--accent); color: #fff; }
  .q-btn.on.bad { background: var(--danger); border-color: var(--danger); color: #fff; }
  .q-btn.suggest { box-shadow: inset 0 0 0 2px #f59e0b; }
  .q-hint { grid-column: 1 / -1; font-size: 12px; color: #d97706; }
  .journal-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 2px 0 8px; }
  .journal-row .hint { margin: 0; flex: 1; min-width: 160px; font-style: italic; }
  .journal-text {
    width: 100%; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; resize: vertical; color-scheme: light dark;
  }
  .j-input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; color-scheme: light dark; }
  .journal-results, .on-this-day { display: grid; gap: 6px; margin-top: 10px; font-size: 13px; }
  .journal-hit { display: grid; gap: 2px; text-align: left; padding: 8px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .journal-hit small { color: var(--muted); }
  dialog.checkin { width: min(600px, calc(100% - 16px)); }
  .ci-status { font-size: 13px; color: #d97706; font-weight: 600; }
  .ci-status.all-done { color: var(--accent); }
  .ci-sec { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .ci-sec:last-child { border-bottom: none; }
  .ci-sec h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .ci-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 14px; flex-wrap: wrap; }
  .ci-row > span:first-child { display: inline-flex; align-items: center; gap: 8px; }
  .ci-ctl { display: inline-flex; align-items: center; gap: 6px; }
  .ci-ctl button { padding: 6px 12px; }
  .ci-ctl input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; color-scheme: light dark; }

  .trade-rec { display: grid; gap: 8px; margin: 4px 0 8px; }
  .trade-results .q-btn { flex: 1; }
  .trade-results { display: flex; }
  .q-btn.res-green.on { background: #16a34a; border-color: #16a34a; color: #fff; }
  .q-btn.res-red.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  .q-btn.res-flat.on { background: var(--muted); border-color: var(--muted); color: #fff; }
  .trade-nums { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); }
  .trade-nums input { width: 76px; font: inherit; color: var(--text); background: var(--empty); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; color-scheme: light dark; }
  .trade-off { font-size: 13px; color: var(--muted); }
  .trade-summary { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .trade-summary b { color: var(--text); }
  .trade-links button { font-size: 13px; padding: 6px 10px; }
  .tabs { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .tabs button { padding: 4px 12px; font-size: 13px; border-radius: 999px; }
  .tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .t-h { margin: 16px 0 8px; font-size: 14px; }
  .t-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .t-dow { text-align: center; font-size: 11px; color: var(--muted); }
  .t-day { aspect-ratio: 1; padding: 2px; border-radius: 8px; display: grid; place-items: center; align-content: center; gap: 0; font-size: 13px; background: var(--empty); border: 1px solid transparent; }
  .t-day small { font-size: 9px; }
  .t-day.res-green { background: #16a34a; color: #fff; }
  .t-day.res-red { background: var(--danger); color: #fff; }
  .t-day.res-flat { background: var(--muted); color: #fff; }
  .t-day.off { opacity: .4; background: transparent; border-color: var(--border); }
  .t-day.today { border-color: var(--text); }
  .t-day.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .t-day:disabled { opacity: .25; }

<script>
  const STORAGE_KEY = "habit-tracker-v1";
  const HEAT_WEEKS = 15;

  // Dates are stored as local YYYY-MM-DD keys so "today" follows the user's clock.
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };


  // Starter habits for a first visit; once anything is saved, saved data wins.
  function defaultHabits() {
    const created = dayKey(startOfToday());
    return [
      { name: "Read 4 chapters of the Bible", color: "#2563eb", target: 4, unit: "chapters", bible: true, position: 0 },
      { name: "Workout", color: "#ea580c", workout: true, weekly: 4 },
      { name: "No sugar", color: "#16a34a" },
      { name: "Bed on time", color: "#7c3aed", time: "22:30", sleep: "bed" },
      { name: "Wake up on time", color: "#eab308", time: "06:00", sleep: "wake" },
      { name: "Screen time under limit", color: "#0d9488", screen: true, limit: 180 },
      // Water counts glasses per day; the goal (target) is stored in glasses even when shown in oz.
      { name: "Drink water", color: "#0ea5e9", water: true, target: 8, waterUnit: "glasses", ozPerGlass: 8 },
      // Question habits are answered yes/no each night; the `good` answer checks the day off.
      { name: "No eating out", color: "#f97316", question: "Eat out today?", good: "no", eatingOut: true },
      { name: "No energy drinks", color: "#84cc16", question: "Any energy drinks today?", good: "no" },
      { name: "Journal", color: "#a855f7", journal: true },
      // Trading discipline questions only apply on trading days.
      { name: "Followed my plan", color: "#10b981", question: "Followed my plan today?", good: "yes", trading: true, tradingPlan: true },
      { name: "Stopped at loss limit", color: "#06b6d4", question: "Stopped at my loss limit?", good: "yes", trading: true },
      { name: "No revenge trades", color: "#6366f1", question: "No revenge trades?", good: "yes", trading: true }
    ].map((h, i) => ({ id: `default-${i}`, ...h, created, done: {} }));
  }

  // Extra features of the starter habits, added to saves made before they existed.
  const STARTER_FEATURES = {
    "default-0": { bible: true, position: 0 },
    "default-1": { workout: true, weekly: 4 },
    "default-3": { sleep: "bed" },
    "default-4": { sleep: "wake" }
  };

  // How many starter habits a save has been offered, so deleted ones don't come back.
  const SEED_KEY = "habit-tracker-seeded";

  function load() {
    let data, seeded = 3;
    try {
      data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      seeded = Number(localStorage.getItem(SEED_KEY)) || 3;
    } catch {}
    const defaults = defaultHabits();
    try { localStorage.setItem(SEED_KEY, defaults.length); } catch {}
    if (!data) return defaults;
    // Older saves had the Bible habit as a plain checkmark; give it its chapter count.
    const bible = data.find(h => h.id === "default-0" && !h.target);
    if (bible) Object.assign(bible, { target: 4, unit: "chapters" });
    // Bed and wake habits saved before target times existed get the default times.
    for (const h of data) {
      const d = defaults.find(x => x.id === h.id && x.time);
      if (d && h.time === undefined) h.time = d.time;
      for (const [k, v] of Object.entries(STARTER_FEATURES[h.id] || {})) {
        if (h[k] === undefined) h[k] = v;
      }
    }
    // Add starter habits introduced after this save was created.
    for (const h of defaults.slice(seeded)) {
      if (!data.some(x => x.id === h.id)) data.push(h);
    }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
    return data;
  }
  // Load habits only after the starter definitions above are ready.
  let habits = load();

  // Every data change goes through a save*(label, mergeKey) call, which also offers Undo.
  function save(label, mergeKey) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(habits)); } catch {}
    commit(label, mergeKey);
  }

  // A day's entry is `true` for checkmark habits, or a number for counted habits.
  const target = h => h.target || 1;
  const count = (h, key) => h.done[key] === true ? target(h) : (h.done[key] || 0);
  const isDone = (h, key) => count(h, key) >= target(h);

  // ---- Streaks ----
  // Habits are daily, or weekly with a goal of h.weekly days per week (weeks run Monday–Sunday).
  // Excused days (h.excused[key]) never break a streak and don't count against completion.
  const WEEK_START = 1;
  const MAX_EXCUSED_PER_MONTH = 2;
  const weekStartOf = d => addDays(d, -((d.getDay() - WEEK_START + 7) % 7));
  const isExcused = (h, key) => !!h.excused?.[key];
  // Question habits: an unanswered day stays blank (not missed) until it's answered.
  const answerOf = (h, key) => h.answers?.[key] || null;
  const isPending = (h, key) => !!h.question && !answerOf(h, key);
  // Days that neither count nor break a streak: excused, unanswered, or not a trading day for trading questions.
  const skipDay = (h, key) => isExcused(h, key) || isPending(h, key) || (!!h.trading && !isTradingDay(key));
  const streakUnit = (h, n) => `${h.weekly ? "week" : "day"}${n === 1 ? "" : "s"}`;

  // Tracking starts at the earliest of the creation date and any filled-in day.
  function trackingStart(h) {
    const keys = [h.created, ...Object.keys(h.done), ...Object.keys(h.excused || {})].filter(Boolean).sort();
    return new Date((keys[0] || dayKey(startOfToday())) + "T00:00:00");
  }
  // Days done (or excused) in the week starting ws, up to and including upTo.
  function weekCount(h, ws, upTo = addDays(ws, 6)) {
    let n = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      if (d > upTo) break;
      const k = dayKey(d);
      if (isDone(h, k) || isExcused(h, k)) n++;
    }
    return n;
  }
  const weekMet = (h, ws) => weekCount(h, ws) >= h.weekly;

  // One pass through the habit's history: current streak, longest streak, and the
  // date each streak length was first reached (used for milestone badges).
  function streakInfo(h) {
    const today = startOfToday();
    let run = 0, longest = 0;
    const reached = {};
    // Comebacks: a new streak that starts after an earlier one broke. `gap` is how long the
    // return took (days, or weeks for weekly habits), counted from the first missed day/week.
    let brokeAt = null, comebacks = 0, fastest = null, backOn = false;
    const broke = at => { if (run > 0) { brokeAt = at; backOn = false; } run = 0; };
    const started = at => {
      if (run === 0 && brokeAt) {
        comebacks++;
        const gap = Math.max(Math.round(daysBetween(brokeAt, at) / (h.weekly ? 7 : 1)), 1);
        fastest = fastest === null ? gap : Math.min(fastest, gap);
        brokeAt = null;
        backOn = true;
      }
    };
    if (h.weekly) {
      const cur = weekStartOf(today);
      for (let ws = weekStartOf(trackingStart(h)); ws <= cur; ws = addDays(ws, 7)) {
        if (weekMet(h, ws)) {
          started(ws);
          run++;
          if (run > longest) {
            longest = run;
            // The day the goal was reached that week.
            let d = ws;
            while (weekCount(h, ws, d) < h.weekly) d = addDays(d, 1);
            reached[run] = dayKey(d);
          }
        } else if (+ws !== +cur) broke(ws); // this week isn't over yet, so it doesn't break the streak
      }
      return { current: run, longest, reached, comebacks, fastest, backOn: backOn && run > 0 };
    }
    for (let d = trackingStart(h); d <= today; d = addDays(d, 1)) {
      const k = dayKey(d);
      if (isDone(h, k)) {
        started(d);
        run++;
        if (run > longest) { longest = run; reached[run] = k; }
      } else if (!skipDay(h, k) && +d !== +today) broke(d); // today not done yet doesn't break it
    }
    return { current: run, longest, reached, comebacks, fastest, backOn: backOn && run > 0 };
  }
  const currentStreak = h => streakInfo(h).current;
  const longestStreak = h => streakInfo(h).longest;

  function rate(h, days) {
    const today = startOfToday();
    const start = trackingStart(h);
    let total = 0, hit = 0;
    if (h.weekly) {
      // Share of recent weeks that met the goal: the finished weeks in range, plus this week once it's met.
      const cur = weekStartOf(today);
      for (let i = 1; i <= Math.round(days / 7); i++) {
        const ws = addDays(cur, -7 * i);
        if (addDays(ws, 6) < start) break;
        total++;
        if (weekMet(h, ws)) hit++;
      }
      if (weekMet(h, cur)) { total++; hit++; }
      return total ? Math.round(hit / total * 100) : 0;
    }
    for (let i = 0; i < days; i++) {
      const d = addDays(today, -i);
      if (d < start) break;
      const k = dayKey(d);
      if (skipDay(h, k) && !isDone(h, k)) continue;
      total++;
      if (isDone(h, k)) hit++;
    }
    return total ? Math.round(hit / total * 100) : 0;
  }

  // Checkmark habits flip on/off; counted habits step 0 → 1 → … → target → back to 0.
  function toggle(id, key) {
    const h = habits.find(h => h.id === id);
    const prev = count(h, key);
    const next = (prev + 1) % (target(h) + 1);
    if (!next) delete h.done[key];
    else h.done[key] = target(h) === 1 ? true : next;
    // Each chapter tapped moves the Bible bookmark; resetting the day takes them back off.
    if (h.bible) h.position = Math.min(Math.max((h.position || 0) + next - prev, 0), BIBLE_TOTAL);
    save(`${h.name}: ${target(h) > 1 ? `${next}/${target(h)}` : next ? "checked off" : "unchecked"} (${shortDate(key)})`); render();
  }

  // ---- Bible bookmark ----
  const BIBLE = [
    ["Genesis", 50], ["Exodus", 40], ["Leviticus", 27], ["Numbers", 36], ["Deuteronomy", 34],
    ["Joshua", 24], ["Judges", 21], ["Ruth", 4], ["1 Samuel", 31], ["2 Samuel", 24],
    ["1 Kings", 22], ["2 Kings", 25], ["1 Chronicles", 29], ["2 Chronicles", 36], ["Ezra", 10],
    ["Nehemiah", 13], ["Esther", 10], ["Job", 42], ["Psalms", 150], ["Proverbs", 31],
    ["Ecclesiastes", 12], ["Song of Solomon", 8], ["Isaiah", 66], ["Jeremiah", 52], ["Lamentations", 5],
    ["Ezekiel", 48], ["Daniel", 12], ["Hosea", 14], ["Joel", 3], ["Amos", 9],
    ["Obadiah", 1], ["Jonah", 4], ["Micah", 7], ["Nahum", 3], ["Habakkuk", 3],
    ["Zephaniah", 3], ["Haggai", 2], ["Zechariah", 14], ["Malachi", 4],
    ["Matthew", 28], ["Mark", 16], ["Luke", 24], ["John", 21], ["Acts", 28],
    ["Romans", 16], ["1 Corinthians", 16], ["2 Corinthians", 13], ["Galatians", 6], ["Ephesians", 6],
    ["Philippians", 4], ["Colossians", 4], ["1 Thessalonians", 5], ["2 Thessalonians", 3], ["1 Timothy", 6],
    ["2 Timothy", 4], ["Titus", 3], ["Philemon", 1], ["Hebrews", 13], ["James", 5],
    ["1 Peter", 5], ["2 Peter", 3], ["1 John", 5], ["2 John", 1], ["3 John", 1],
    ["Jude", 1], ["Revelation", 22]
  ];
  const BIBLE_TOTAL = BIBLE.reduce((s, [, n]) => s + n, 0);

  // Position is the number of chapters read from Genesis 1; returns the chapter after it.
  function chapterAt(position) {
    let left = position;
    for (const [book, n] of BIBLE) {
      if (left < n) return `${book} ${left + 1}`;
      left -= n;
    }
    return null;
  }
  // "John 3" → chapters read through the end of John 3.
  function parseChapter(text) {
    const m = text.trim().toLowerCase().replace(/\s+/g, " ").match(/^(.+?)\s*(\d+)$/);
    if (!m) return null;
    const name = m[1].replace(/^(\d)(\D)/, "$1 $2"), ch = Number(m[2]);
    const i = BIBLE.findIndex(([b]) => b.toLowerCase() === name) >= 0
      ? BIBLE.findIndex(([b]) => b.toLowerCase() === name)
      : BIBLE.findIndex(([b]) => b.toLowerCase().startsWith(name));
    if (i < 0 || ch < 1 || ch > BIBLE[i][1]) return null;
    return BIBLE.slice(0, i).reduce((s, [, n]) => s + n, 0) + ch;
  }
  function bibleLine(h) {
    const pos = h.position || 0;
    if (pos >= BIBLE_TOTAL) return "📖 You've read the whole Bible! Use “Set place” to start again.";
    const today = startOfToday();
    const leftToday = isDone(h, dayKey(today)) ? 0 : target(h) - count(h, dayKey(today));
    const afterToday = Math.max(BIBLE_TOTAL - pos - leftToday, 0);
    const finish = addDays(today, Math.ceil(afterToday / target(h)));
    const pct = (pos / BIBLE_TOTAL * 100).toFixed(1);
    return `📖 Next: <b>${chapterAt(pos)}</b> · ${pct}% of the Bible · finish ≈ ${
      finish.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
  }

  // ---- Sleep times ----
  const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  // Bedtimes before noon count as after midnight, so 12:30 AM is later than 10:30 PM.
  const bedMin = t => { const m = toMin(t); return m < 720 ? m + 1440 : m; };
  function onTime(h, t) {
    return h.sleep === "bed" ? bedMin(t) <= bedMin(h.time) : toMin(t) <= toMin(h.time);
  }
  function minutesOff(h, t) {
    return h.sleep === "bed" ? bedMin(t) - bedMin(h.time) : toMin(t) - toMin(h.time);
  }
  // Compact clock for the day circles: "10:45p".
  const shortClock = t => {
    const [h, m] = t.split(":").map(Number);
    return `${h % 12 || 12}:${String(m).padStart(2, "0")}${h < 12 ? "a" : "p"}`;
  };
  const duration = m => `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, "0")}m`;

  // A night belongs to the day you went to bed; you wake up the next day.
  function sleepNights(days) {
    const bed = habits.find(h => h.sleep === "bed"), wake = habits.find(h => h.sleep === "wake");
    if (!bed || !wake) return [];
    const nights = [];
    for (let i = 1; i <= days; i++) {
      const d = addDays(startOfToday(), -i);
      const b = bed.log?.[dayKey(d)], w = wake.log?.[dayKey(addDays(d, 1))];
      if (b && w) nights.push((toMin(w) + 1440 - toMin(b)) % 1440);
    }
    return nights;
  }
  function sleepLine() {
    const nights = sleepNights(7);
    if (!nights.length) return "";
    const avg = nights.reduce((s, n) => s + n, 0) / nights.length;
    return `😴 Last night: <b>${duration(nights[0])}</b> · 7-night average: <b>${duration(avg)}</b>`;
  }

  // ---- Screen time ----
  // Accepts "3h 25m", "3h", "45m", "3:25", or a bare number (hours up to 16, minutes above).
  function parseDuration(text) {
    const t = text.trim().toLowerCase().replace(/\s+/g, "");
    let m;
    if ((m = t.match(/^(\d+(?:\.\d+)?)h(?:(\d+)m?)?$/))) return Math.round(parseFloat(m[1]) * 60 + Number(m[2] || 0));
    if ((m = t.match(/^(\d+)m(?:in)?$/))) return Number(m[1]);
    if ((m = t.match(/^(\d+):(\d{1,2})$/))) return Number(m[1]) * 60 + Number(m[2]);
    if ((m = t.match(/^\d+(?:\.\d+)?$/))) { const n = parseFloat(t); return Math.round(n <= 16 ? n * 60 : n); }
    return null;
  }
  // Compact length for the day circles: "3h25", "45m".
  const shortDur = n => n >= 60 ? `${Math.floor(n / 60)}h${n % 60 ? String(n % 60).padStart(2, "0") : ""}` : `${n}m`;
  const underLimit = (h, n) => n <= h.limit;

  function screenLine(h) {
    const today = h.minutes?.[dayKey(startOfToday())];
    const week = [];
    for (let i = 0; i < 7; i++) {
      const n = h.minutes?.[dayKey(addDays(startOfToday(), -i))];
      if (n !== undefined) week.push(n);
    }
    if (!week.length) return "";
    const avg = week.reduce((s, n) => s + n, 0) / week.length;
    return `📱 ${today !== undefined ? `Today: <b>${duration(today)}</b> of ${duration(h.limit)} · ` : ""}7-day average: <b>${duration(avg)}</b>`;
  }

  // ---- Water ----
  const inOz = h => h.waterUnit === "oz";
  // Glasses → the number shown in the chosen unit.
  const waterShown = (h, glasses) => inOz(h) ? Math.round(glasses * h.ozPerGlass) : +glasses.toFixed(1);
  const waterUnitLabel = h => inOz(h) ? "oz" : "glasses";

  function addWater(h, key, delta) {
    const next = Math.max(count(h, key) + delta, 0);
    if (next) h.done[key] = next; else delete h.done[key];
    save(`${delta > 0 ? "Added" : "Removed"} a glass (${shortDate(key)})`); render();
  }

  function waterLine(h) {
    const today = startOfToday();
    // Average from when tracking began, including days filled in before the habit was added.
    const firstKey = [h.created, ...Object.keys(h.done)].sort()[0];
    const created = new Date(firstKey + "T00:00:00");
    let total = 0, days = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(today, -i);
      if (d < created) break;
      total += count(h, dayKey(d)); days++;
    }
    const avg = days ? total / days : 0;
    return `💧 Today: <b>${waterShown(h, count(h, dayKey(today)))}/${waterShown(h, target(h))} ${waterUnitLabel(h)}</b>` +
      ` · 7-day average: <b>${waterShown(h, avg)}</b> ${waterUnitLabel(h)}`;
  }

  // Water day circles: tap opens the amount editor, a long press takes off one glass.
  function attachLongPress(btn, onLong) {
    let timer = null, fired = false;
    const cancel = () => clearTimeout(timer);
    btn.addEventListener("pointerdown", () => {
      fired = false;
      timer = setTimeout(() => { fired = true; onLong(); }, 550);
    });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) btn.addEventListener(ev, cancel);
    btn.addEventListener("contextmenu", e => e.preventDefault());
    // Swallow the click that follows a long press.
    btn.addEventListener("click", e => { if (fired) { e.stopImmediatePropagation(); fired = false; } }, true);
  }

  function workoutLine(h) {
    let mins = 0, sessions = 0;
    for (let i = 0; i < 7; i++) {
      const x = h.details?.[dayKey(addDays(startOfToday(), -i))];
      if (x) { sessions++; mins += x.minutes || 0; }
    }
    return sessions ? `🏋️ Last 7 days: <b>${sessions}</b> logged workout${sessions === 1 ? "" : "s"} · <b>${mins}</b> min` : "";
  }

  // ---- Day details editor (sleep times, workouts, notes) ----
  let editing = null; // { id, key }

  function openEditor(id, key) {
    editing = editing && editing.id === id && editing.key === key ? null : { id, key };
    settingsFor = null;
    render();
  }

  function buildEditor(h) {
    const today = startOfToday();
    const key = editing.key;
    const box = document.createElement("div");
    box.className = "editor";

    const daySel = document.createElement("select");
    for (let i = 0; i < 7; i++) {
      const k = dayKey(addDays(today, -i));
      const o = new Option(i === 0 ? "Today" : i === 1 ? "Yesterday"
        : addDays(today, -i).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }), k);
      daySel.append(o);
    }
    daySel.value = key;
    daySel.onchange = () => { editing.key = daySel.value; render(); };
    const dayRow = document.createElement("div");
    dayRow.className = "editor-row";
    dayRow.append(daySel);
    box.append(dayRow);

    const fields = {};
    if (h.question) {
      const row = document.createElement("div");
      row.className = "editor-row";
      const lbl = document.createElement("label");
      lbl.textContent = `${h.question} `;
      const sel = document.createElement("select");
      sel.append(new Option("Not answered", ""), new Option("Yes", "yes"), new Option("No", "no"));
      sel.value = answerOf(h, key) || "";
      lbl.append(sel);
      row.append(lbl);
      box.append(row);
      fields.answer = sel;
    }
    if (h.sleep) {
      const row = document.createElement("div");
      row.className = "editor-row";
      const t = document.createElement("input");
      t.type = "time";
      t.value = h.log?.[key] || "";
      const now = document.createElement("button");
      now.type = "button";
      now.textContent = "Now";
      now.onclick = () => { const d = new Date(); t.value = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
      const lbl = document.createElement("label");
      lbl.textContent = h.sleep === "bed" ? "Went to bed at " : "Woke up at ";
      lbl.append(t);
      row.append(lbl, now);
      box.append(row);
      fields.time = t;
    }
    if (h.screen) {
      const row = document.createElement("div");
      row.className = "editor-row";
      const lbl = document.createElement("label");
      lbl.textContent = "Screen time ";
      const t = document.createElement("input");
      t.type = "text";
      t.placeholder = "e.g. 3h 25m";
      t.style.flex = "0 1 140px";
      const n = h.minutes?.[key];
      const hh = Math.floor(n / 60), mm = n % 60;
      t.value = n === undefined ? "" : hh && mm ? `${hh}h ${mm}m` : hh ? `${hh}h` : `${mm}m`;
      lbl.append(t);
      row.append(lbl);
      box.append(row);
      fields.screen = t;
    }
    if (h.water) {
      const row = document.createElement("div");
      row.className = "editor-row";
      const lbl = document.createElement("label");
      lbl.textContent = "Amount ";
      const a = document.createElement("input");
      a.type = "number";
      a.min = 0; a.step = inOz(h) ? 1 : 0.5;
      a.inputMode = "decimal";
      a.className = "mins";
      a.value = count(h, key) ? waterShown(h, count(h, key)) : "";
      lbl.append(a, ` ${waterUnitLabel(h)}`);
      row.append(lbl);
      box.append(row);
      fields.water = a;
    }
    if (h.workout) {
      const row = document.createElement("div");
      row.className = "editor-row";
      const act = document.createElement("input");
      act.type = "text";
      act.placeholder = "Activity, e.g. Run";
      act.value = h.details?.[key]?.activity || "";
      act.setAttribute("list", `acts-${h.id}`);
      const list = document.createElement("datalist");
      list.id = `acts-${h.id}`;
      for (const a of new Set(Object.values(h.details || {}).map(x => x.activity).filter(Boolean))) list.append(new Option(a));
      const mins = document.createElement("input");
      mins.type = "number";
      mins.min = 0; mins.step = 5;
      mins.placeholder = "Minutes";
      mins.className = "mins";
      mins.value = h.details?.[key]?.minutes || "";
      row.append(act, list, mins);
      box.append(row);
      fields.activity = act; fields.minutes = mins;
    }
    const noteRow = document.createElement("div");
    noteRow.className = "editor-row";
    // The journal's day panel edits the entry itself instead of a separate note.
    const note = document.createElement(h.journal ? "textarea" : "input");
    if (h.journal) { note.rows = 4; note.className = "journal-text"; }
    else note.type = "text";
    note.placeholder = h.name === "No sugar" ? "Note, e.g. what made it hard today" : "Note (optional)";
    note.value = (h.journal ? h.journalText?.[key] : h.notes?.[key]) || "";
    if (h.journal) note.placeholder = "How was today?";
    noteRow.append(note);
    box.append(noteRow);

    // Excused (sick, travel): keeps the streak alive, limited per calendar month.
    const exRow = document.createElement("div");
    exRow.className = "editor-row excuse-row";
    const exLbl = document.createElement("label");
    const ex = document.createElement("input");
    ex.type = "checkbox";
    ex.checked = isExcused(h, key);
    const used = excusedInMonth(h, key) - (ex.checked ? 1 : 0);
    const left = MAX_EXCUSED_PER_MONTH - used;
    ex.disabled = !ex.checked && left <= 0;
    exLbl.append(ex, " Excused (sick, travel) — keeps your streak");
    const exInfo = document.createElement("span");
    exInfo.className = "hint";
    exInfo.style.margin = "0";
    exInfo.textContent = left <= 0 && !ex.checked ? `Both excused days for ${monthName(key)} are used`
      : `${left} of ${MAX_EXCUSED_PER_MONTH} left in ${monthName(key)}`;
    exRow.append(exLbl, exInfo);
    box.append(exRow);

    const btns = document.createElement("div");
    btns.className = "editor-row";
    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "primary";
    saveBtn.textContent = "Save";
    saveBtn.onclick = () => {
      if (fields.time) {
        h.log = h.log || {};
        if (fields.time.value) {
          h.log[key] = fields.time.value;
          if (onTime(h, fields.time.value)) h.done[key] = true; else delete h.done[key];
        } else { delete h.log[key]; delete h.done[key]; }
      }
      if (fields.screen) {
        h.minutes = h.minutes || {};
        if (fields.screen.value.trim()) {
          const n = parseDuration(fields.screen.value);
          if (n === null) { alert("Enter screen time like “3h 25m”, “45m” or “3:25”."); return; }
          h.minutes[key] = n;
          if (underLimit(h, n)) h.done[key] = true; else delete h.done[key];
        } else { delete h.minutes[key]; delete h.done[key]; }
      }
      if (fields.water) {
        const v = parseFloat(fields.water.value) || 0;
        const glasses = inOz(h) ? v / h.ozPerGlass : v;
        if (glasses > 0) h.done[key] = Math.round(glasses * 100) / 100; else delete h.done[key];
      }
      if (fields.activity) {
        h.details = h.details || {};
        const activity = fields.activity.value.trim(), minutes = parseFloat(fields.minutes.value) || 0;
        if (activity || minutes) { h.details[key] = { activity, minutes }; h.done[key] = true; }
        else delete h.details[key];
      }
      if (fields.answer) setAnswer(h, key, fields.answer.value);
      if (h.journal) setJournal(h, key, note.value);
      else {
        h.notes = h.notes || {};
        if (note.value.trim()) h.notes[key] = note.value.trim(); else delete h.notes[key];
      }
      h.excused = h.excused || {};
      if (ex.checked) h.excused[key] = true; else delete h.excused[key];
      editing = null;
      save(`Saved ${h.name} for ${shortDate(key)}`); render();
    };
    const closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.textContent = "Close";
    closeBtn.onclick = () => { editing = null; render(); };
    btns.append(saveBtn, closeBtn);
    box.append(btns);

    // Recent notes, newest first, to help spot patterns.
    const recent = Object.entries(h.notes || {}).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 5);
    if (recent.length) {
      const r = document.createElement("div");
      r.className = "recent-notes";
      r.innerHTML = "<b>Recent notes</b>";
      for (const [k, text] of recent) {
        const line = document.createElement("div");
        line.textContent = `${shortDate(k)} — ${text}`;
        r.append(line);
      }
      box.append(r);
    }
    return box;
  }

  // ---- Perfect days ----
  // How a habit stands on a day: "done", "missed", or "off" (not due — before tracking began,
  // excused, or a weekly habit that doesn't need that day).
  function dayState(h, key) {
    const d = fromKey(key);
    if (d < trackingStart(h)) return "off";
    if (h.trading && !isTradingDay(key)) return "off";
    if (isDone(h, key)) return "done";
    if (isExcused(h, key)) return "off";
    // Unanswered questions count as not done yet today, and as blank on past days.
    if (isPending(h, key)) return key === dayKey(startOfToday()) ? "missed" : "off";
    if (h.weekly) {
      const ws = weekStartOf(d);
      const before = weekCount(h, ws, addDays(d, -1));
      if (before >= h.weekly) return "done"; // goal already met this week
      const daysLeft = 7 - daysBetween(ws, d); // including this day
      // Due only when skipping this day would make the week's goal impossible.
      return h.weekly - before >= daysLeft ? "missed" : "off";
    }
    return "missed";
  }
  function dayScore(key) {
    let done = 0, total = 0;
    for (const h of habits) {
      const s = dayState(h, key);
      if (s === "off") continue;
      total++;
      if (s === "done") done++;
    }
    return { done, total };
  }
  const isPerfect = s => s.total > 0 && s.done === s.total;

  function perfectStreak() {
    if (!habits.length) return 0;
    const first = new Date(Math.min(...habits.map(h => +trackingStart(h))));
    let d = startOfToday();
    // Today not perfect yet doesn't break the streak.
    if (!isPerfect(dayScore(dayKey(d)))) d = addDays(d, -1);
    let n = 0;
    for (; d >= first; d = addDays(d, -1)) {
      const s = dayScore(dayKey(d));
      if (!s.total) continue; // nothing was due
      if (!isPerfect(s)) break;
      n++;
    }
    return n;
  }

  // ---- Last-chance warning ----
  const LAST_CHANCE_HOUR = 20;
  const LAST_CHANCE_DISMISS_KEY = "habit-tracker-lastchance-dismissed";

  // Streaks of 3+ that end at midnight unless today gets done. Sleep and screen time are
  // logged after the fact, so they're left out.
  function streaksAtRisk() {
    const today = startOfToday(), k = dayKey(today);
    const out = [];
    for (const h of habits) {
      if (h.sleep || h.screen || isDone(h, k) || isExcused(h, k) || (h.trading && !isTradingDay(k))) continue;
      if (h.question && answerOf(h, k)) continue; // answered the bad way: already missed
      const s = currentStreak(h);
      if (s < 3) continue;
      if (h.weekly) {
        // A weekly streak ends with the week (Sunday night), if doing it today would still meet the goal.
        const ws = weekStartOf(today);
        if (daysBetween(ws, today) !== 6 || weekMet(h, ws) || weekCount(h, ws) + 1 < h.weekly) continue;
      }
      out.push({ h, s });
    }
    return out;
  }
  const riskText = ({ h, s }) => `Your ${s}-${h.weekly ? "week" : "day"} ${h.name} streak ends at midnight.`;

  function renderLastChance() {
    const el = document.getElementById("lastChance");
    const todayKey = dayKey(startOfToday());
    const list = new Date().getHours() >= LAST_CHANCE_HOUR && getPref(LAST_CHANCE_DISMISS_KEY) !== todayKey ? streaksAtRisk() : [];
    el.hidden = !list.length;
    const box = document.getElementById("lastChanceText");
    box.innerHTML = "";
    for (const r of list) {
      const line = document.createElement("span");
      line.append("⏳ Your ");
      const b = document.createElement("b");
      b.textContent = `${r.s}-${r.h.weekly ? "week" : "day"}`;
      line.append(b, ` ${r.h.name} streak ends at midnight.`);
      box.append(line);
    }
  }

  // ---- Milestone badges ----
  // Badges are worked out from the history itself, so they survive Export/Import and Undo
  // without being stored separately.
  const DAY_BADGES = [[7, "🔥", "7-day streak"], [30, "⭐", "30-day streak"], [100, "💯", "100-day streak"], [365, "🏆", "365-day streak"]];
  const WEEK_BADGES = [[4, "🔥", "4-week streak"], [12, "⭐", "12-week streak"], [26, "💎", "26-week streak"], [52, "🏆", "52-week streak"]];
  const BIBLE_BADGES = [[25, "📖", "25% of the Bible"], [50, "📖", "Halfway through"], [75, "📖", "75% of the Bible"], [100, "🏆", "Whole Bible"]];

  function weightStreakInfo() {
    const list = sortedWeights();
    if (!list.length) return { current: 0, reached: {} };
    const weeks = weighedWeeks(), cur = weekOf(startOfToday());
    let run = 0, longest = 0;
    const reached = {};
    for (let w = weekOf(fromKey(list[0].date)); w <= cur; w = addDays(w, 7)) {
      if (weeks.has(dayKey(w))) {
        run++;
        if (run > longest) { longest = run; reached[run] = list.find(e => e.date >= dayKey(w)).date; }
      } else if (+w !== +cur) run = 0;
    }
    return { current: run, reached };
  }

  // [{ name, color, unit, current, items: [{ id, icon, label, need, earned }] }]
  function badgeGroups() {
    const groups = [];
    const streakGroup = (name, color, weekly, info, idBase) => ({
      name, color, unit: weekly ? "weeks" : "days", current: info.current,
      items: (weekly ? WEEK_BADGES : DAY_BADGES).map(([n, icon, label]) =>
        ({ id: `${idBase}:${weekly ? "w" : "d"}${n}`, icon, label, need: n, earned: info.reached[n] || null }))
    });
    for (const h of habits) {
      groups.push(streakGroup(h.name, h.color, !!h.weekly, streakInfo(h), h.id));
      if (h.bible) {
        const pct = (h.position || 0) / BIBLE_TOTAL * 100;
        groups.push({
          name: "Bible progress", color: h.color, unit: "%", current: +pct.toFixed(1),
          items: BIBLE_BADGES.map(([p, icon, label]) => ({ id: `${h.id}:b${p}`, icon, label, need: p, earned: pct >= p ? true : null }))
        });
      }
    }
    groups.push(streakGroup("Weekly weight", WEIGHT_COLOR, true, weightStreakInfo(), "weight"));
    return groups;
  }

  function renderBadges() {
    const groups = badgeGroups();
    const all = groups.flatMap(g => g.items);
    document.getElementById("badgesSummary").textContent = `${all.filter(b => b.earned).length} of ${all.length} earned`;
    const body = document.getElementById("badgesBody");
    body.innerHTML = "";
    for (const g of groups) {
      const sec = document.createElement("div");
      sec.className = "badge-group";
      const h3 = document.createElement("h3");
      h3.innerHTML = `<span class="dot" style="background:${g.color}"></span>`;
      h3.append(g.name);
      const row = document.createElement("div");
      row.className = "badge-row";
      for (const b of g.items) {
        const chip = document.createElement("span");
        chip.className = "badge" + (b.earned ? " earned" : "");
        chip.textContent = `${b.earned ? b.icon : "🔒"} ${b.label}`;
        if (typeof b.earned === "string") {
          const when = document.createElement("small");
          when.textContent = fromKey(b.earned).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
          chip.append(" ", when);
        }
        row.append(chip);
      }
      sec.append(h3, row);
      const next = g.items.find(b => !b.earned);
      if (next) {
        const have = Math.min(g.current, next.need);
        const n = document.createElement("div");
        n.className = "badge-next";
        n.textContent = g.unit === "%" ? `Next: ${next.label} — you're at ${g.current}%`
          : `Next: ${next.label} — current streak ${g.current} of ${next.need} ${g.unit}`;
        n.insertAdjacentHTML("beforeend", `<div class="bar"><i style="width:${have / next.need * 100}%;background:${g.color}"></i></div>`);
        sec.append(n);
      }
      body.append(sec);
    }
  }

  // ---- Celebrations ----
  // Compare against what was true after the last render; anything newly earned today gets a moment.
  let celebrated = null; // { day, perfect, badges: Map(id → badge) }

  function earnedBadges() {
    const m = new Map();
    for (const g of badgeGroups()) for (const b of g.items) if (b.earned) m.set(b.id, { ...b, group: g.name });
    return m;
  }

  function checkCelebrations() {
    const k = dayKey(startOfToday());
    const state = { day: k, perfect: isPerfect(dayScore(k)), badges: earnedBadges() };
    if (celebrated && celebrated.day === k) {
      const fresh = [...state.badges.values()].filter(b => !celebrated.badges.has(b.id));
      if (fresh.length) {
        const b = fresh[fresh.length - 1];
        celebrate(`${b.icon} ${b.label}!`, fresh.length > 1 ? `${b.group} and ${fresh.length - 1} more` : b.group);
      } else if (state.perfect && !celebrated.perfect) {
        const n = perfectStreak();
        celebrate("🌟 Perfect day!", n > 1 ? `Everything done — ${n} perfect days in a row` : "Everything done today");
      }
    }
    celebrated = state;
  }

  function celebrate(title, sub) {
    const layer = document.createElement("div");
    layer.className = "celebrate";
    const pop = document.createElement("div");
    pop.className = "pop";
    const b = document.createElement("b");
    b.textContent = title;
    const s = document.createElement("span");
    s.textContent = sub;
    pop.append(b, s);
    layer.append(pop);
    const colors = ["#f59e0b", "#16a34a", "#0ea5e9", "#db2777", "#7c3aed", "#ea580c"];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement("i");
      c.style.left = `${Math.random() * 100}%`;
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = `${1.2 + Math.random()}s`;
      c.style.animationDelay = `${Math.random() * 0.3}s`;
      layer.append(c);
    }
    document.body.append(layer);
    setTimeout(() => layer.remove(), 2600);
  }

  // ---- Question habits ----
  function setAnswer(h, key, a) {
    h.answers = h.answers || {};
    if (a) h.answers[key] = a; else delete h.answers[key];
    if (a && a === h.good) h.done[key] = true; else delete h.done[key];
  }
  // Tapping the answer that's already chosen clears it.
  function answerQuestion(h, key, a) {
    const next = answerOf(h, key) === a ? "" : a;
    setAnswer(h, key, next);
    save(next ? `${h.name}: ${next === "yes" ? "Yes" : "No"} (${shortDate(key)})` : `${h.name}: answer cleared`);
    render();
    if (checkinIsOpen()) renderCheckin();
  }
  const foodSpent = key => spending.entries.filter(e => e.date === key && e.category === "Food").reduce((s, e) => s + e.amount, 0);
  // "Eat out today?" is pre-answered Yes (waiting for you to confirm) when Food was bought that day.
  const suggestedAnswer = (h, key) => h.eatingOut && foodSpent(key) > 0 ? "yes" : null;
  function eatingOutLine() {
    const ym = dayKey(startOfToday()).slice(0, 7);
    return `🍔 Spent eating out this month: <b>${money(categoryTotals(`${ym}-01`, `${ym}-31`).Food || 0)}</b>`;
  }

  function questionRow(h, key) {
    const row = document.createElement("div");
    row.className = "q-row";
    const q = document.createElement("span");
    q.className = "q-text";
    q.textContent = h.question;
    const btns = document.createElement("span");
    btns.className = "q-btns";
    const a = answerOf(h, key), s = !a && suggestedAnswer(h, key);
    for (const v of ["yes", "no"]) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "q-btn" + (a === v ? ` on ${v === h.good ? "good" : "bad"}` : "") + (s === v ? " suggest" : "");
      b.textContent = v === "yes" ? "Yes" : "No";
      b.setAttribute("aria-pressed", a === v);
      b.onclick = () => answerQuestion(h, key, v);
      btns.append(b);
    }
    row.append(q, btns);
    if (s) {
      const hint = document.createElement("span");
      hint.className = "q-hint";
      hint.textContent = `You logged ${money(foodSpent(key))} of Food — tap Yes to confirm.`;
      row.append(hint);
    }
    return row;
  }

  // Statement import: flag Food charges on days you answered "no eating out".
  function eatingOutFlags(row) {
    const h = habits.find(x => x.eatingOut);
    if (!h || row.category !== "Food" || row.amount <= 0 || answerOf(h, row.date) !== "no") return;
    row.flags.push(`You said no eating out on ${shortDate(row.date)}, but there's a ${money(row.amount)} charge${row.note ? ` at ${row.note}` : ""}.`);
    row.changeToYes = false;
    row.applyAnswer = () => { if (row.changeToYes) setAnswer(h, row.date, "yes"); };
    row.choice = () => {
      const wrap = document.createElement("span");
      wrap.className = "csv-choice";
      for (const [val, text] of [[false, "Keep No"], [true, "Change answer to Yes"]]) {
        const l = document.createElement("label");
        const r = document.createElement("input");
        r.type = "radio";
        r.name = `ans-${row.date}-${csvRows.indexOf(row)}`;
        r.checked = row.changeToYes === val;
        r.onchange = () => {
          // One answer per day: every flagged row on that date follows the same choice.
          csvRows.filter(x => x.date === row.date && x.applyAnswer).forEach(x => { x.changeToYes = val; });
          renderCsvPreview([]);
        };
        l.append(r, ` ${text}`);
        wrap.append(l);
      }
      return wrap;
    };
  }

  // ---- Journal ----
  // The journal is a habit: any text checks the day off, erasing it unchecks it.
  const journalHabit = () => habits.find(h => h.journal);
  function setJournal(h, key, text) {
    h.journalText = h.journalText || {};
    if (text.trim()) { h.journalText[key] = text; h.done[key] = true; }
    else { delete h.journalText[key]; delete h.done[key]; }
  }
  let journalKey = null;

  function openJournal(key) {
    if (!journalHabit()) return;
    if (document.getElementById("journalDialog").open) saveJournalEntry();
    journalKey = key;
    renderJournal();
    const dlg = document.getElementById("journalDialog");
    if (!dlg.open) dlg.showModal();
    document.getElementById("journalText").focus();
  }
  // Saves the open entry if it changed. Returns true when it did.
  function saveJournalEntry() {
    const h = journalHabit();
    const ta = document.getElementById("journalText");
    if (!h || !journalKey || (h.journalText?.[journalKey] || "") === ta.value) return false;
    setJournal(h, journalKey, ta.value);
    save(`Journal saved (${shortDate(journalKey)})`, `journal-${journalKey}`);
    render();
    return true;
  }

  function renderJournal() {
    const h = journalHabit();
    const todayKey = dayKey(startOfToday());
    const dateIn = document.getElementById("journalDate");
    dateIn.value = journalKey;
    dateIn.max = todayKey;
    document.getElementById("journalText").value = h.journalText?.[journalKey] || "";
    document.getElementById("journalDay").textContent = journalKey === todayKey ? "Today"
      : fromKey(journalKey).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    renderJournalSearch();
  }

  function renderJournalSearch() {
    const h = journalHabit();
    const q = document.getElementById("journalSearch").value.trim().toLowerCase();
    const entries = Object.entries(h.journalText || {}).sort((a, b) => b[0].localeCompare(a[0]));
    const hits = q ? entries.filter(([, t]) => t.toLowerCase().includes(q)) : entries.slice(0, 5);
    const box = document.getElementById("journalResults");
    box.innerHTML = `<b>${q ? `${hits.length} entr${hits.length === 1 ? "y" : "ies"} matching “${q.replace(/[<>&"]/g, "")}”` : entries.length ? "Recent entries" : "No entries yet"}</b>`;
    for (const [k, text] of hits.slice(0, 50)) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "journal-hit";
      const d = document.createElement("small");
      d.textContent = fromKey(k).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      const s = document.createElement("span");
      // Show the text around the match.
      const i = q ? text.toLowerCase().indexOf(q) : 0;
      const start = Math.max(i - 40, 0);
      s.textContent = (start ? "…" : "") + text.slice(start, start + 140) + (text.length > start + 140 ? "…" : "");
      b.append(d, s);
      b.onclick = () => { saveJournalEntry(); journalKey = k; renderJournal(); };
      box.append(b);
    }
  }

  // Entries from 1, 3 and 6 months ago today.
  function onThisDay() {
    const h = journalHabit();
    if (!h) return [];
    const t = startOfToday();
    return [1, 3, 6].map(n => {
      const d = new Date(t.getFullYear(), t.getMonth() - n, 1);
      d.setDate(Math.min(t.getDate(), new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
      const k = dayKey(d);
      return h.journalText?.[k] ? { n, key: k, text: h.journalText[k] } : null;
    }).filter(Boolean);
  }

  // ---- Nightly check-in ----
  // One screen for everything still open today: questions, unchecked habits, trading, journal.
  const checkinIsOpen = () => document.getElementById("checkinDialog").open;

  function openCheckin() {
    renderCheckin();
    const dlg = document.getElementById("checkinDialog");
    if (!dlg.open) dlg.showModal();
  }

  // What's still open today, for the check-in header.
  function checkinRemaining(todayKey) {
    const qs = habits.filter(h => h.question && !answerOf(h, todayKey) && !(h.trading && !isTradingDay(todayKey))).length;
    const hs = checkinHabits(todayKey).length;
    const j = journalHabit() && !journalHabit().journalText?.[todayKey] ? 1 : 0;
    return { qs, hs, j, total: qs + hs + j + tradingRemaining(todayKey) };
  }
  // Unchecked habits the check-in can finish (bedtime is logged later, so it's left out).
  const checkinHabits = todayKey => habits.filter(h => !h.question && !h.journal && h.sleep !== "bed" &&
    !isDone(h, todayKey) && !isExcused(h, todayKey) && dayState(h, todayKey) === "missed");

  function renderCheckin() {
    const todayKey = dayKey(startOfToday());
    const body = document.getElementById("checkinBody");
    const rem = checkinRemaining(todayKey);
    const parts = [rem.qs && `${rem.qs} question${rem.qs === 1 ? "" : "s"}`, rem.hs && `${rem.hs} habit${rem.hs === 1 ? "" : "s"}`,
      tradingRemaining(todayKey) && "trading", rem.j && "your journal"].filter(Boolean);
    const status = document.getElementById("checkinStatus");
    status.textContent = rem.total ? `Still open: ${parts.join(", ")}` : "All done for today ✓";
    status.classList.toggle("all-done", !rem.total);
    body.innerHTML = "";
    const section = (title) => { const s = document.createElement("section"); s.className = "ci-sec"; s.innerHTML = `<h3>${title}</h3>`; body.append(s); return s; };

    const qs = habits.filter(h => h.question && !h.trading);
    if (qs.length) {
      const s = section("Questions");
      for (const h of qs) s.append(questionRow(h, todayKey));
    }

    const trading = checkinTrading(todayKey);
    if (trading) body.append(trading);

    const open = checkinHabits(todayKey);
    if (open.length) {
      const s = section("Not done yet");
      for (const h of open) s.append(checkinHabitRow(h, todayKey));
    }

    const jh = journalHabit();
    if (jh) {
      const s = section("📝 How was today?");
      const ta = document.createElement("textarea");
      ta.className = "journal-text";
      ta.rows = 4;
      ta.placeholder = "A line or two is plenty.";
      ta.value = jh.journalText?.[todayKey] || "";
      // Saves as you type (one Undo for the whole entry); the cards refresh when you leave the box.
      ta.oninput = () => {
        setJournal(jh, todayKey, ta.value);
        save(`Journal saved (${shortDate(todayKey)})`, `journal-${todayKey}`);
        const r = checkinRemaining(todayKey);
        status.textContent = r.total ? status.textContent : "All done for today ✓";
      };
      ta.onchange = () => { render(); renderCheckin(); };
      s.append(ta);
      const memories = onThisDay();
      if (memories.length) {
        const m = document.createElement("div");
        m.className = "on-this-day";
        m.innerHTML = "<b>On this day</b>";
        for (const e of memories) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "journal-hit";
          const d = document.createElement("small");
          d.textContent = `${e.n} month${e.n === 1 ? "" : "s"} ago · ${fromKey(e.key).toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
          const sp = document.createElement("span");
          sp.textContent = e.text.length > 200 ? e.text.slice(0, 200) + "…" : e.text;
          b.append(d, sp);
          b.onclick = () => { document.getElementById("checkinDialog").close(); openJournal(e.key); };
          m.append(b);
        }
        s.append(m);
      }
    }
  }

  // A quick control to finish one habit from the check-in.
  function checkinHabitRow(h, key) {
    const row = document.createElement("div");
    row.className = "ci-row";
    const name = document.createElement("span");
    name.innerHTML = `<span class="dot" style="background:${h.color}"></span>`;
    name.append(h.name);
    const ctl = document.createElement("span");
    ctl.className = "ci-ctl";
    const btn = (text, fn, primary) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = text;
      if (primary) { b.className = "primary"; b.style.background = b.style.borderColor = h.color; }
      b.onclick = () => { fn(); renderCheckin(); };
      ctl.append(b);
      return b;
    };
    if (h.water) {
      const c = document.createElement("span");
      c.textContent = `${waterShown(h, count(h, key))}/${waterShown(h, target(h))} ${waterUnitLabel(h)}`;
      btn("−", () => addWater(h, key, -1)).disabled = !count(h, key);
      ctl.append(c);
      btn("+1", () => addWater(h, key, 1), true);
    } else if (target(h) > 1) {
      const c = document.createElement("span");
      c.textContent = `${count(h, key)}/${target(h)}`;
      ctl.append(c);
      btn("+1", () => toggle(h.id, key), true);
    } else if (h.screen || h.sleep === "wake") {
      const inp = document.createElement("input");
      inp.type = h.screen ? "text" : "time";
      inp.placeholder = h.screen ? "3h 25m" : "";
      if (h.screen) inp.style.width = "90px";
      ctl.append(inp);
      btn("Save", () => {
        if (!inp.value) return;
        if (h.screen) {
          const n = parseDuration(inp.value);
          if (n === null) { alert("Enter screen time like “3h 25m”, “45m” or “3:25”."); return; }
          h.minutes = h.minutes || {};
          h.minutes[key] = n;
          if (underLimit(h, n)) h.done[key] = true; else delete h.done[key];
        } else {
          h.log = h.log || {};
          h.log[key] = inp.value;
          if (onTime(h, inp.value)) h.done[key] = true; else delete h.done[key];
        }
        save(`Saved ${h.name} for ${shortDate(key)}`); render();
      }, true);
    } else {
      btn("Done ✓", () => toggle(h.id, key), true);
    }
    row.append(name, ctl);
    return row;
  }


  const excusedInMonth = (h, key) => Object.keys(h.excused || {}).filter(k => k.slice(0, 7) === key.slice(0, 7)).length;
  const monthName = key => fromKey(key).toLocaleDateString(undefined, { month: "long" });

  // History grid: one column per week (Monday–Sunday) back to when tracking began,
  // at least HEAT_WEEKS wide, scrolled so the latest week shows first.
  function buildHeat(h, today) {
    const end = weekStartOf(today);
    const weeks = Math.max(HEAT_WEEKS, Math.round(daysBetween(weekStartOf(trackingStart(h)), end) / 7) + 1);
    const start = addDays(end, -(weeks - 1) * 7);
    const wrap = document.createElement("div");
    wrap.className = "heat-wrap";
    const inner = document.createElement("div");
    inner.className = "heat-inner";
    const months = document.createElement("div");
    months.className = "heat-months";
    months.style.gridTemplateColumns = `repeat(${weeks}, 10px)`;
    const grid = document.createElement("div");
    grid.className = "heat";
    let lastMonth = null, lastLabel = null, lastLabelWeek = -9;
    for (let w = 0; w < weeks; w++) {
      const ws = addDays(start, 7 * w);
      const m = `${ws.getFullYear()}-${ws.getMonth()}`;
      if (m !== lastMonth) {
        // Labels need ~3 weeks of room; a month squeezed in after a partial one replaces it.
        if (w - lastLabelWeek < 3) lastLabel.remove();
        const lab = document.createElement("span");
        // Show the year on January and on the first label.
        lab.textContent = ws.toLocaleDateString(undefined, ws.getMonth() === 0 || !months.children.length ? { month: "short", year: "2-digit" } : { month: "short" });
        lab.style.gridRow = "1";
        lab.style.gridColumn = `${w + 1}`;
        months.append(lab);
        lastMonth = m; lastLabel = lab; lastLabelWeek = w;
      }
      for (let i = 0; i < 7; i++) {
        const d = addDays(ws, i);
        const k = dayKey(d);
        const cell = document.createElement("i");
        if (d > today) cell.style.visibility = "hidden";
        else if (count(h, k)) {
          cell.style.background = h.color;
          if (!isDone(h, k)) cell.style.opacity = 0.4;
        } else if (isExcused(h, k)) {
          cell.style.background = "var(--muted)";
          cell.style.opacity = 0.45;
        }
        cell.title = d.toLocaleDateString() + (isExcused(h, k) && !isDone(h, k) ? " · Excused" : "");
        grid.append(cell);
      }
    }
    inner.append(months, grid);
    wrap.append(inner);
    return wrap;
  }

  // ---- Habit settings (name, color, how often) ----
  let settingsFor = null; // habit id

  function freqSelect(value) {
    const sel = document.createElement("select");
    sel.append(new Option("Every day", ""));
    for (let n = 1; n <= 6; n++) sel.append(new Option(`${n}× per week`, n));
    sel.value = value || "";
    return sel;
  }

  function buildSettings(h) {
    const box = document.createElement("div");
    box.className = "editor";
    const row1 = document.createElement("div");
    row1.className = "editor-row";
    const name = document.createElement("input");
    name.type = "text";
    name.maxLength = 60;
    name.value = h.name;
    const color = document.createElement("input");
    color.type = "color";
    color.value = h.color;
    row1.append(name, color);
    const row2 = document.createElement("div");
    row2.className = "editor-row";
    const freq = freqSelect(h.weekly);
    const lbl = document.createElement("label");
    lbl.append("How often ", freq);
    row2.append(lbl);
    const row3 = document.createElement("div");
    row3.className = "editor-row";
    const ok = document.createElement("button");
    ok.type = "button";
    ok.className = "primary";
    ok.textContent = "Save";
    ok.onclick = () => {
      if (name.value.trim()) h.name = name.value.trim();
      h.color = color.value;
      if (freq.value) h.weekly = Number(freq.value); else delete h.weekly;
      settingsFor = null;
      save(`Updated ${h.name}`); render();
    };
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = "Cancel";
    cancel.onclick = () => { settingsFor = null; render(); };
    row3.append(ok, cancel);
    box.append(row1, row2, row3);
    return box;
  }

  function render() {
    const today = startOfToday();
    const todayKey = dayKey(today);
    document.getElementById("today").textContent =
      today.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    const score = dayScore(todayKey);
    document.getElementById("sumToday").textContent = score.total ? `${Math.round(score.done / score.total * 100)}%` : "–";
    document.getElementById("sumTodayLabel").textContent = score.total ? `${score.done} of ${score.total} done today` : "nothing due today";
    document.getElementById("sumToday").parentElement.classList.toggle("perfect", isPerfect(score));
    const ps = perfectStreak();
    document.getElementById("sumPerfect").textContent = `🌟 ${ps}`;
    document.getElementById("sumBest").textContent = habits.length ? Math.max(...habits.map(currentStreak)) : 0;
    document.getElementById("sumRate").textContent =
      habits.length ? Math.round(habits.reduce((s, h) => s + rate(h, 30), 0) / habits.length) + "%" : "0%";

    const list = document.getElementById("list");
    list.innerHTML = "";
    if (!habits.length) {
      list.innerHTML = `<div class="empty-state">No habits yet. Add one above to get started.</div>`;
      return;
    }

    for (const h of habits) {
      const el = document.createElement("div");
      el.className = "habit";

      const top = document.createElement("div");
      top.className = "habit-top";
      top.innerHTML = `<span class="dot" style="background:${h.color}"></span>`;
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = h.name;
      const streak = document.createElement("span");
      streak.className = "streak";
      const s = currentStreak(h);
      streak.textContent = (s ? `🔥 ${s} ${streakUnit(h, s)}` : "No streak") +
        (h.weekly ? ` · ${Math.min(weekCount(h, weekStartOf(today)), h.weekly)}/${h.weekly} this week` : "");
      top.append(name);
      if (h.time !== undefined) {
        const goal = document.createElement("label");
        goal.className = "goal-time";
        goal.textContent = "Goal ";
        const input = document.createElement("input");
        input.type = "time";
        input.value = h.time;
        input.onchange = () => {
          if (!input.value) return;
          h.time = input.value;
          // Re-judge logged days against the new goal.
          for (const [k, t] of Object.entries(h.log || {})) {
            if (onTime(h, t)) h.done[k] = true; else delete h.done[k];
          }
          save(`Changed ${h.name} goal`); render();
        };
        goal.append(input);
        top.append(goal);
      }
      if (h.screen) {
        const goal = document.createElement("label");
        goal.className = "goal-time";
        goal.textContent = "Limit ";
        const input = document.createElement("input");
        input.type = "number";
        input.min = 0.25; input.step = 0.25;
        input.style.width = "64px";
        input.value = +(h.limit / 60).toFixed(2);
        input.onchange = () => {
          const v = parseFloat(input.value);
          if (!(v > 0)) return;
          h.limit = Math.round(v * 60);
          // Re-judge logged days against the new limit.
          for (const [k, n] of Object.entries(h.minutes || {})) {
            if (underLimit(h, n)) h.done[k] = true; else delete h.done[k];
          }
          save("Changed screen time limit"); render();
        };
        goal.append(input, " h");
        top.append(goal);
      }
      if (h.water) {
        const goal = document.createElement("label");
        goal.className = "goal-time";
        goal.textContent = "Goal ";
        const input = document.createElement("input");
        input.type = "number";
        input.min = 1; input.step = inOz(h) ? 1 : 0.5;
        input.style.width = "64px";
        input.value = waterShown(h, target(h));
        input.onchange = () => {
          const v = parseFloat(input.value);
          if (!(v > 0)) return;
          h.target = inOz(h) ? v / h.ozPerGlass : v;
          save("Changed water goal"); render();
        };
        const unit = document.createElement("select");
        unit.append(new Option("glasses", "glasses"), new Option("oz", "oz"));
        unit.value = h.waterUnit || "glasses";
        unit.onchange = () => { h.waterUnit = unit.value; save("Changed water units"); render(); };
        goal.append(input, " ", unit);
        top.append(goal);
      }
      top.append(streak);
      // Glass size only matters when amounts are shown in oz; keep the oz goal the same when it changes.
      if (h.water && inOz(h)) {
        const row = document.createElement("label");
        row.className = "goal-time water-glass";
        row.textContent = "1 glass = ";
        const oz = document.createElement("input");
        oz.type = "number";
        oz.min = 1; oz.step = 1;
        oz.style.width = "56px";
        oz.value = h.ozPerGlass;
        oz.onchange = () => {
          const v = parseFloat(oz.value);
          if (!(v > 0)) return;
