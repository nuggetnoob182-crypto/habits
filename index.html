  // ---- Statement CSV import ----
  // Format: date,amount,category,note — date YYYY-MM-DD, positive amount = purchase,
  // negative = refund, unknown categories go to Other.
  function parseCsv(text) {
    const rows = [];
    let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (ch === '"') q = false;
        else field += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += ch;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim()));
  }

  let csvRows = []; // rows shown in the preview

  function openCsvPreview(text) {
    const rows = parseCsv(text.replace(/^﻿/, ""));
    const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
    if (head.join(",") !== "date,amount,category,note") {
      alert("That file doesn't match the statement format.\n\nThe first line must be exactly:\ndate,amount,category,note");
      return;
    }
    const errors = [];
    const used = new Set(); // hand-logged purchases already matched to a row
    csvRows = [];
    rows.forEach((r, i) => {
      const [date = "", amountText = "", catText = "", note = ""] = r.map(c => c.trim());
      const amount = Math.round(parseFloat(amountText.replace(/[$,]/g, "")) * 100) / 100;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(fromKey(date)) || !amount) { errors.push(`Line ${i + 2}: ${r.join(",")}`); return; }
      const category = CATEGORIES.find(c => c.toLowerCase() === catText.toLowerCase()) || "Other";
      const row = { date, amount, category, note, rawCategory: catText, checked: true, flags: [] };
      if (category === "Other" && catText && catText.toLowerCase() !== "other") row.flags.push(`Unknown category “${catText}” → Other`);
      // Already imported before (same date, amount and note)?
      if (spending.entries.some(e => e.source === "import" && e.date === date && Math.abs(e.amount - amount) < 0.005 && (e.note || "") === note)) {
        row.status = "already imported"; row.checked = false;
      } else {
        // A purchase logged by hand with the same amount within 2 days.
        const match = spending.entries.find(e => !used.has(e.id) && e.source !== "import" && !e.billId &&
          Math.abs(e.amount - amount) < 0.005 && Math.abs(daysBetween(fromKey(e.date), fromKey(date))) <= 2);
        if (match) {
          used.add(match.id);
          row.status = "already logged"; row.checked = false;
          row.match = `${shortDate(match.date)} ${match.category}${match.note ? " — " + match.note : ""}`;
        }
      }
      csvRowExtras(row);
      csvRows.push(row);
    });
    renderCsvPreview(errors);
    document.getElementById("csvDialog").showModal();
  }
  // Hook for checks other features add to each row (e.g. eating-out answers).
  function csvRowExtras(row) { eatingOutFlags(row); }

  function renderCsvPreview(errors) {
    const body = document.getElementById("csvBody");
    body.innerHTML = "";
    const summary = () => {
      const sel = csvRows.filter(r => r.checked);
      document.getElementById("csvSummary").textContent =
        `${csvRows.length} row${csvRows.length === 1 ? "" : "s"} · ${sel.length} selected · ${money(sel.reduce((s, r) => s + r.amount, 0))}`;
      document.getElementById("csvConfirm").disabled = !sel.length && !csvRows.some(r => r.changeToYes);
    };
    if (errors.length) {
      const e = document.createElement("div");
      e.className = "csv-errors";
      e.textContent = `Skipped ${errors.length} line${errors.length === 1 ? "" : "s"} that couldn't be read: ${errors.slice(0, 5).join(" · ")}${errors.length > 5 ? " …" : ""}`;
      body.append(e);
    }
    for (const r of csvRows) {
      const row = document.createElement("label");
      row.className = "csv-row" + (r.status ? " dim" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = r.checked;
      cb.onchange = () => { r.checked = cb.checked; summary(); };
      const main = document.createElement("span");
      main.className = "csv-main";
      main.textContent = `${shortDate(r.date)} · ${r.category}${r.note ? " — " + r.note : ""}`;
      const amt = document.createElement("span");
      amt.className = "csv-amt";
      amt.textContent = r.amount < 0 ? `−${money(-r.amount)} refund` : money(r.amount);
      row.append(cb, main, amt);
      const notes = [...(r.status ? [`${r.status}${r.match ? ` (${r.match})` : ""} — skipped unless you tick it`] : []), ...r.flags];
      for (const n of notes) {
        const s = document.createElement("small");
        s.className = "csv-flag";
        s.textContent = n;
        row.append(s);
      }
      if (r.choice) row.append(r.choice());
      body.append(row);
    }
    summary();
  }

  function confirmCsv() {
    const importId = uid();
    const add = csvRows.filter(r => r.checked);
    for (const r of add) spending.entries.push({ id: uid(), date: r.date, amount: r.amount, category: r.category, note: r.note, source: "import", importId });
    if (spending.started > add.map(r => r.date).sort()[0]) spending.started = add.map(r => r.date).sort()[0];
    const changed = csvRows.filter(r => r.changeToYes).length;
    csvRows.forEach(r => r.applyAnswer?.());
    // One Undo covers the whole import, including any changed answers.
    if (changed) save(`Imported ${add.length} purchases`, "csv");
    saveSpending(`Imported ${add.length} purchase${add.length === 1 ? "" : "s"}`, "csv");
    document.getElementById("csvDialog").close();
    renderSpending(); render();
  }

  // ---- Trading ----
  // Kept apart from personal spending: payouts and prop-firm costs never touch the budget,
  // daily allowance or spending streaks.
  // days[key] = { noTrade?, traded?, result?: "green"|"red"|"flat", r?, accounts? }
  // firms = [{ id, name, eval, funded, blown, history: [{ date, eval, funded, blown }] }]
  const TRADING_KEY = "habit-tracker-trading";
  const TRADE_COLOR = "#059669";
  const COST_TYPES = ["Eval", "Reset", "Activation", "Data", "Other"];
  const RESULTS = { green: "Green", red: "Red", flat: "Flat" };
  let trading = loadTrading();
  const tradingView = { tab: "calendar", month: null, editDay: null, editEntry: null };

  function normalizeTrading(data) {
    return { days: {}, firms: [], payouts: [], costs: [], ...(data || {}) };
  }
  function loadTrading() {
    try { return normalizeTrading(JSON.parse(localStorage.getItem(TRADING_KEY))); } catch { return normalizeTrading(); }
  }
  function saveTrading(label, mergeKey) {
    try { localStorage.setItem(TRADING_KEY, JSON.stringify(trading)); } catch {}
    commit(label, mergeKey);
  }

  // Weekdays are trading days unless marked "Didn't trade"; a weekend counts if marked as traded.
  function isTradingDay(key) {
    const rec = trading.days[key] || {};
    if (rec.noTrade) return false;
    if (rec.traded) return true;
    const d = fromKey(key).getDay();
    return d !== 0 && d !== 6;
  }
  const activeAccounts = () => trading.firms.reduce((s, f) => s + f.eval + f.funded, 0);
  const fundedAccounts = () => trading.firms.reduce((s, f) => s + f.funded, 0);
  const firmName = id => trading.firms.find(f => f.id === id)?.name || "Deleted firm";
  const planHabit = () => habits.find(h => h.tradingPlan);
  const signedR = r => `${r > 0 ? "+" : r < 0 ? "−" : ""}${+Math.abs(r).toFixed(2)}R`;

  // Green-day %, total and average R over a date range, plus followed-plan vs not.
  function tradingStats(from, to) {
    const days = Object.entries(trading.days).filter(([k, d]) => k >= from && k <= to && d.result && isTradingDay(k));
    const sum = list => {
      const n = list.length;
      const green = list.filter(([, d]) => d.result === "green").length;
      const r = list.reduce((s, [, d]) => s + (Number(d.r) || 0), 0);
      return { n, green, pct: n ? Math.round(green / n * 100) : 0, r, avg: n ? r / n : 0 };
    };
    const ph = planHabit();
    return {
      all: sum(days),
      followed: sum(days.filter(([k]) => ph && answerOf(ph, k) === "yes")),
      notFollowed: sum(days.filter(([k]) => ph && answerOf(ph, k) === "no"))
    };
  }

  function setDayRecord(key, fields, label) {
    trading.days[key] = { ...(trading.days[key] || {}), ...fields };
    for (const [k, v] of Object.entries(trading.days[key])) if (v === undefined || v === "") delete trading.days[key][k];
    if (!Object.keys(trading.days[key]).length) delete trading.days[key];
    saveTrading(label, `trade-${key}`);
    render(); renderTrading();
    if (checkinIsOpen()) renderCheckin();
    if (document.getElementById("tradingDialog").open) renderTradingDialog();
  }

  // Result + R + accounts editor for one day (used on the card, in the check-in and the calendar).
  function dayRecordEditor(key) {
    const rec = trading.days[key] || {};
    const box = document.createElement("div");
    box.className = "trade-rec";
    if (!isTradingDay(key)) {
      const p = document.createElement("div");
      p.className = "trade-off";
      p.textContent = rec.noTrade ? "Marked as didn't trade — questions and results don't apply." : "Not a trading day.";
      const b = document.createElement("button");
      b.type = "button";
      b.className = "link";
      b.textContent = rec.noTrade ? "I did trade" : "I traded today";
      b.onclick = () => setDayRecord(key, rec.noTrade ? { noTrade: undefined } : { traded: true }, rec.noTrade ? "Marked as a trading day" : "Marked as traded");
      p.append(" ", b);
      box.append(p);
      return box;
    }
    const res = document.createElement("div");
    res.className = "q-btns trade-results";
    for (const [v, label] of Object.entries(RESULTS)) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = `q-btn res-${v}` + (rec.result === v ? " on" : "");
      b.textContent = label;
      b.onclick = () => setDayRecord(key, {
        result: rec.result === v ? undefined : v,
        accounts: rec.accounts ?? activeAccounts()
      }, `Trading ${shortDate(key)}: ${rec.result === v ? "result cleared" : label}`);
      res.append(b);
    }
    const nums = document.createElement("div");
    nums.className = "trade-nums";
    const rLbl = document.createElement("label");
    rLbl.textContent = "R ";
    const r = document.createElement("input");
    r.type = "number"; r.step = "0.25"; r.inputMode = "decimal"; r.placeholder = "+2 / −1";
    if (rec.r !== undefined) r.value = rec.r;
    r.onchange = () => setDayRecord(key, { r: r.value === "" ? undefined : Number(r.value), accounts: rec.accounts ?? activeAccounts() }, `Trading ${shortDate(key)}: R updated`);
    rLbl.append(r);
    const aLbl = document.createElement("label");
    aLbl.textContent = "Accounts ";
    const a = document.createElement("input");
    a.type = "number"; a.min = 0; a.step = 1;
    a.value = rec.accounts ?? activeAccounts();
    a.onchange = () => setDayRecord(key, { accounts: a.value === "" ? undefined : Number(a.value) }, `Trading ${shortDate(key)}: accounts updated`);
    aLbl.append(a);
    const no = document.createElement("button");
    no.type = "button";
    no.className = "link";
    no.textContent = "Didn't trade";
    no.onclick = () => setDayRecord(key, { noTrade: true, traded: undefined }, `${shortDate(key)}: didn't trade`);
    nums.append(rLbl, aLbl, no);
    box.append(res, nums);
    return box;
  }

  // Check-in: today's result and the discipline questions, on trading days.
  function checkinTrading(key) {
    const s = document.createElement("section");
    s.className = "ci-sec";
    s.innerHTML = "<h3>📈 Trading</h3>";
    s.append(dayRecordEditor(key));
    if (isTradingDay(key)) for (const h of habits.filter(x => x.trading)) s.append(questionRow(h, key));
    return s;
  }
  function tradingRemaining(key) {
    if (!isTradingDay(key)) return 0;
    return (trading.days[key]?.result ? 0 : 1) + habits.filter(h => h.trading && !answerOf(h, key)).length;
  }

  // Blown accounts this month, from each firm's dated history.
  function countAt(f, field, key) {
    const snap = (f.history || []).filter(s => s.date <= key).pop();
    return snap ? snap[field] : 0;
  }
  function blownInMonth(ym) {
    const end = `${ym}-31`, before = dayKey(addDays(fromKey(`${ym}-01`), -1));
    return trading.firms.reduce((s, f) => s + Math.max(countAt(f, "blown", end) - countAt(f, "blown", before), 0), 0);
  }
  // Active (eval + funded) and funded totals at the end of a month.
  function accountsAt(ym) {
    const end = `${ym}-31`;
    return {
      active: trading.firms.reduce((s, f) => s + countAt(f, "eval", end) + countAt(f, "funded", end), 0),
      funded: trading.firms.reduce((s, f) => s + countAt(f, "funded", end), 0)
    };
  }

  const payoutTotal = (from, to, firmId) => trading.payouts.filter(p => p.date >= from && p.date <= to && (!firmId || p.firmId === firmId)).reduce((s, p) => s + p.amount, 0);
  const costTotal = (from, to, firmId) => trading.costs.filter(p => p.date >= from && p.date <= to && (!firmId || p.firmId === firmId)).reduce((s, p) => s + p.amount, 0);

  function renderTrading() {
    const todayKey = dayKey(startOfToday());
    const ym = todayKey.slice(0, 7);
    const m = tradingStats(`${ym}-01`, todayKey).all;
    const net = payoutTotal(`${ym}-01`, todayKey) - costTotal(`${ym}-01`, todayKey);
    const sec = document.getElementById("trading");
    sec.innerHTML = `
      <div class="habit">
        <div class="habit-top">
          <span class="dot" style="background:${TRADE_COLOR}"></span>
          <span class="name">Trading</span>
          <span class="streak">${m.n ? `${m.pct}% green · ${signedR(m.r)} this month` : "No results this month"}</span>
        </div>
        <div class="hint" style="margin:8px 0 4px">Today</div>
        <div id="tradeToday"></div>
        <div class="trade-summary">
          <span>Active accounts <b>${activeAccounts()}</b></span>
          <span>Funded <b>${fundedAccounts()}</b></span>
          <span>Net this month <b style="color:${net < 0 ? "var(--danger)" : net > 0 ? "var(--accent)" : "inherit"}">${net < 0 ? "−" : ""}${money(Math.abs(net))}</b></span>
        </div>
        <div class="rate-row trade-links">
          <button type="button" data-tab="calendar">📅 Calendar &amp; stats</button>
          <button type="button" data-tab="accounts">🏦 Accounts</button>
          <button type="button" data-tab="money">💵 Payouts &amp; costs</button>
        </div>
      </div>`;
    document.getElementById("tradeToday").append(dayRecordEditor(todayKey));
    sec.querySelectorAll(".trade-links button").forEach(b => b.onclick = () => openTrading(b.dataset.tab));
  }

  function openTrading(tab) {
    tradingView.tab = tab;
    tradingView.month = tradingView.month || dayKey(startOfToday()).slice(0, 7);
    renderTradingDialog();
    const dlg = document.getElementById("tradingDialog");
    if (!dlg.open) dlg.showModal();
  }

  function renderTradingDialog() {
    document.querySelectorAll("#tradingTabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tradingView.tab));
    const body = document.getElementById("tradingBody");
    body.innerHTML = "";
    ({ calendar: renderTradeCalendar, accounts: renderAccounts, money: renderTradeMoney })[tradingView.tab](body);
  }

  function statBoxes(title, s, followed, notFollowed) {
    const wrap = document.createElement("div");
    wrap.innerHTML = `<h3 class="t-h">${title}</h3>
      <div class="work-totals">
        <div><b>${s.n ? s.pct + "%" : "–"}</b>Green days · ${s.green}/${s.n}</div>
        <div><b>${s.n ? signedR(s.r) : "–"}</b>Total R</div>
        <div><b>${s.n ? signedR(s.avg) : "–"}</b>Avg R / day</div>
      </div>
      <div class="plan-compare">
        <div><span>Followed plan</span><b>${followed.n ? `${followed.pct}% green · ${signedR(followed.avg)} avg` : "no days yet"}</b><small>${followed.n} day${followed.n === 1 ? "" : "s"}</small></div>
        <div><span>Didn't follow</span><b>${notFollowed.n ? `${notFollowed.pct}% green · ${signedR(notFollowed.avg)} avg` : "no days yet"}</b><small>${notFollowed.n} day${notFollowed.n === 1 ? "" : "s"}</small></div>
      </div>`;
    return wrap;
  }

  function renderTradeCalendar(body) {
    const ym = tradingView.month;
    const todayKey = dayKey(startOfToday());
    const nav = document.createElement("div");
    nav.className = "week-nav";
    nav.innerHTML = `<button type="button" class="link" id="calPrev">‹ Earlier</button><b>${monthLabel(ym, { month: "long", year: "numeric" })}</b><button type="button" class="link" id="calNext">Later ›</button>`;
    body.append(nav);
    nav.querySelector("#calPrev").onclick = () => { tradingView.month = addMonths(ym, -1); tradingView.editDay = null; renderTradingDialog(); };
    const next = nav.querySelector("#calNext");
    next.disabled = ym >= todayKey.slice(0, 7);
    next.onclick = () => { tradingView.month = addMonths(ym, 1); tradingView.editDay = null; renderTradingDialog(); };

    const cal = document.createElement("div");
    cal.className = "t-cal";
    for (const d of ["M", "T", "W", "T", "F", "S", "S"]) cal.insertAdjacentHTML("beforeend", `<span class="t-dow">${d}</span>`);
    const first = fromKey(`${ym}-01`);
    for (let i = 0; i < (first.getDay() + 6) % 7; i++) cal.append(document.createElement("span"));
    const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    for (let n = 1; n <= days; n++) {
      const k = `${ym}-${String(n).padStart(2, "0")}`;
      const rec = trading.days[k] || {};
      const b = document.createElement("button");
      b.type = "button";
      const off = !isTradingDay(k);
      b.className = "t-day" + (rec.result && !off ? ` res-${rec.result}` : "") + (off ? " off" : "") + (k === tradingView.editDay ? " sel" : "") + (k === todayKey ? " today" : "");
      b.disabled = k > todayKey;
      b.innerHTML = `<span>${n}</span>${rec.r !== undefined && !off ? `<small>${signedR(rec.r)}</small>` : ""}`;
      b.title = off ? (rec.noTrade ? "Didn't trade" : "Not a trading day") : rec.result ? `${RESULTS[rec.result]}${rec.r !== undefined ? ` · ${signedR(rec.r)}` : ""}` : "No result yet";
      b.onclick = () => { tradingView.editDay = tradingView.editDay === k ? null : k; renderTradingDialog(); };
      cal.append(b);
    }
    body.append(cal);
    if (tradingView.editDay) {
      const ed = document.createElement("div");
      ed.className = "editor";
      ed.innerHTML = `<b>${fromKey(tradingView.editDay).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}</b>`;
      ed.append(dayRecordEditor(tradingView.editDay));
      body.append(ed);
    }
    const monthEnd = ym === todayKey.slice(0, 7) ? todayKey : `${ym}-31`;
    const ms = tradingStats(`${ym}-01`, monthEnd);
    body.append(statBoxes(monthLabel(ym, { month: "long", year: "numeric" }), ms.all, ms.followed, ms.notFollowed));
    const all = tradingStats(FIRST_DAY, todayKey);
    body.append(statBoxes("All time", all.all, all.followed, all.notFollowed));
  }

  function renderAccounts(body) {
    const todayKey = dayKey(startOfToday());
    const ym = todayKey.slice(0, 7);
    body.insertAdjacentHTML("beforeend", `<div class="work-totals" style="margin-top:10px">
      <div><b>${activeAccounts()}</b>Active (eval + funded)</div>
      <div><b>${fundedAccounts()}</b>Funded</div>
      <div><b>${blownInMonth(ym)}</b>Blown this month</div>
    </div>`);
    for (const f of trading.firms) {
      const card = document.createElement("div");
      card.className = "firm";
      const head = document.createElement("div");
      head.className = "firm-head";
      const nm = document.createElement("b");
      nm.textContent = f.name;
      const acts = document.createElement("span");
      const rn = document.createElement("button");
      rn.type = "button"; rn.className = "link"; rn.textContent = "Rename";
      rn.onclick = () => {
        const n = prompt("Firm name", f.name);
        if (n && n.trim()) { f.name = n.trim(); saveTrading(`Renamed firm to ${f.name}`); renderTradingDialog(); renderTrading(); }
      };
      const del = document.createElement("button");
      del.type = "button"; del.className = "link danger"; del.textContent = "Delete";
      del.onclick = () => {
        if (!confirm(`Delete ${f.name}? Its payouts and costs stay in your totals.`)) return;
        trading.firms = trading.firms.filter(x => x.id !== f.id);
        saveTrading(`Deleted firm ${f.name}`); renderTradingDialog(); renderTrading();
      };
      acts.append(rn, del);
      head.append(nm, acts);
      card.append(head);
      const counters = document.createElement("div");
      counters.className = "counters";
      for (const [field, label] of [["eval", "Eval"], ["funded", "Funded"], ["blown", "Blown / closed"]]) {
        const c = document.createElement("div");
        c.className = "counter";
        c.innerHTML = `<span>${label}</span>`;
        const minus = document.createElement("button");
        minus.type = "button"; minus.textContent = "−"; minus.disabled = !f[field];
        const val = document.createElement("b");
        val.textContent = f[field];
        const plus = document.createElement("button");
        plus.type = "button"; plus.textContent = "+";
        const change = delta => {
          f[field] = Math.max(f[field] + delta, 0);
          // Each change is kept with its date so counts can be shown over time.
          f.history = (f.history || []).filter(s => s.date !== todayKey);
          f.history.push({ date: todayKey, eval: f.eval, funded: f.funded, blown: f.blown });
          saveTrading(`${f.name}: ${label} ${delta > 0 ? "+1" : "−1"}`); renderTradingDialog(); renderTrading();
        };
        minus.onclick = () => change(-1);
        plus.onclick = () => change(1);
        const row = document.createElement("span");
        row.className = "counter-ctl";
        row.append(minus, val, plus);
        c.append(row);
        counters.append(c);
      }
      card.append(counters);
      body.append(card);
    }
    const form = document.createElement("form");
    form.className = "rate-row";
    form.innerHTML = `<input type="text" name="name" placeholder="Add a prop firm" maxlength="40" required class="spend-note"><button type="submit">Add firm</button>`;
    form.onsubmit = e => {
      e.preventDefault();
      const name = form.elements.name.value.trim();
      if (!name) return;
      trading.firms.push({ id: uid(), name, eval: 0, funded: 0, blown: 0, history: [] });
      saveTrading(`Added firm ${name}`); renderTradingDialog(); renderTrading();
    };
    body.append(form);
    // Active and funded counts at each month's end, last 12 months.
    if (trading.firms.some(f => f.history?.length)) {
      const months = Array.from({ length: 12 }, (_, i) => addMonths(ym, i - 11));
      body.append(lineChart(months.map(m => ({ label: monthLabel(m, { month: "narrow" }), a: accountsAt(m).active, b: accountsAt(m).funded })), "Active", "Funded"));
    }
  }

  // Two-series line chart (plain SVG).
  function lineChart(points, aName, bName) {
    const W = 320, H = 120, L = 22, R = 6, T = 10, B = 18;
    const max = Math.max(1, ...points.flatMap(p => [p.a, p.b]));
    const x = i => L + i * (W - L - R) / Math.max(points.length - 1, 1);
    const y = v => T + (1 - v / max) * (H - T - B);
    const path = key => points.map((p, i) => `${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
    const wrap = document.createElement("div");
    wrap.innerHTML = `<h3 class="t-h">Accounts over time</h3>
      <svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Accounts over time">
        <line x1="${L}" x2="${W - R}" y1="${y(max)}" y2="${y(max)}" style="stroke:var(--border)"/>
        <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--border)"/>
        <text x="${L - 4}" y="${y(max) + 3}" text-anchor="end">${max}</text>
        <text x="${L - 4}" y="${y(0) + 3}" text-anchor="end">0</text>
        <polyline points="${path("a")}" fill="none" style="stroke:${TRADE_COLOR}" stroke-width="2"/>
        <polyline points="${path("b")}" fill="none" style="stroke:#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
        ${points.map((p, i) => `<text x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle">${p.label}</text>`).join("")}
      </svg>
      <div class="legend"><span><i style="background:${TRADE_COLOR}"></i>${aName}</span><span><i style="background:#f59e0b"></i>${bName}</span></div>`;
    return wrap;
  }

  function renderTradeMoney(body) {
    const todayKey = dayKey(startOfToday());
    const ym = todayKey.slice(0, 7);
    const mp = payoutTotal(`${ym}-01`, todayKey), mc = costTotal(`${ym}-01`, todayKey);
    const ap = payoutTotal(FIRST_DAY, todayKey), ac = costTotal(FIRST_DAY, todayKey);
    const signed = n => `<span style="color:${n < 0 ? "var(--danger)" : n > 0 ? "var(--accent)" : "inherit"}">${n < 0 ? "−" : ""}${money(Math.abs(n))}</span>`;
    body.insertAdjacentHTML("beforeend", `<h3 class="t-h">This month</h3>
      <div class="work-totals"><div><b>${money(mp)}</b>Payouts</div><div><b>${money(mc)}</b>Costs</div><div><b>${signed(mp - mc)}</b>Net</div></div>
      <h3 class="t-h">All time</h3>
      <div class="work-totals"><div><b>${money(ap)}</b>Payouts</div><div><b>${money(ac)}</b>Costs</div><div><b>${signed(ap - ac)}</b>Net</div></div>`);

    // Add / edit form
    const editing = tradingView.editEntry;
    const entry = editing && (editing.kind === "payout" ? trading.payouts : trading.costs).find(x => x.id === editing.id);
    const form = document.createElement("form");
    form.className = "rate-row trade-form";
    const firmOpts = trading.firms.map(f => `<option value="${f.id}">${f.name.replace(/</g, "&lt;")}</option>`).join("");
    form.innerHTML = `
      <select name="kind"><option value="payout">💵 Payout</option><option value="cost">🧾 Cost</option></select>
      <select name="firm">${firmOpts || `<option value="">Add a firm first</option>`}</select>
      <select name="type">${COST_TYPES.map(c => `<option>${c}</option>`).join("")}</select>
      <label>$ <input type="number" name="amount" min="0.01" step="0.01" inputmode="decimal" required style="width:90px"></label>
      <input type="date" name="date" required>
      <button type="submit" class="primary">${entry ? "Save" : "Add"}</button>
      ${entry ? `<button type="button" class="link" id="tmCancel">Cancel</button>` : ""}`;
    const f = form.elements;
    f.date.value = entry?.date || todayKey;
    f.date.max = todayKey;
    if (entry) { f.kind.value = editing.kind; f.firm.value = entry.firmId; f.amount.value = entry.amount; if (entry.type) f.type.value = entry.type; f.kind.disabled = true; }
    const syncType = () => { f.type.hidden = f.kind.value !== "cost"; };
    f.kind.onchange = syncType; syncType();
    form.onsubmit = e => {
      e.preventDefault();
      if (!f.firm.value) { alert("Add a prop firm under Accounts first."); return; }
      const fields = { date: f.date.value, firmId: f.firm.value, amount: Math.round(parseFloat(f.amount.value) * 100) / 100 };
      if (!(fields.amount > 0)) return;
      const kind = entry ? editing.kind : f.kind.value;
      if (kind === "cost") fields.type = f.type.value;
      if (entry) Object.assign(entry, fields);
      else (kind === "payout" ? trading.payouts : trading.costs).push({ id: uid(), ...fields });
      tradingView.editEntry = null;
      saveTrading(`${entry ? "Updated" : "Added"} ${kind} ${money(fields.amount)} (${firmName(fields.firmId)})`);
      renderTradingDialog(); renderTrading();
    };
    body.append(form);
    const cancel = form.querySelector("#tmCancel");
    if (cancel) cancel.onclick = () => { tradingView.editEntry = null; renderTradingDialog(); };

    // 12-month net bar chart
    const months = Array.from({ length: 12 }, (_, i) => addMonths(ym, i - 11));
    const nets = months.map(m => payoutTotal(`${m}-01`, `${m}-31`) - costTotal(`${m}-01`, `${m}-31`));
    const W = 320, H = 130, mid = 65, max = Math.max(1, ...nets.map(Math.abs));
    const bw = (W / 12) * 0.62;
    const bars = nets.map((n, i) => {
      const x = (i + 0.5) * W / 12, h = Math.abs(n) / max * (mid - 14);
      return `<rect x="${(x - bw / 2).toFixed(1)}" y="${(n >= 0 ? mid - h : mid).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" style="fill:${n >= 0 ? "var(--accent)" : "var(--danger)"}"><title>${monthLabel(months[i], { month: "long", year: "numeric" })}: ${n < 0 ? "−" : ""}${money(Math.abs(n))}</title></rect>
        <text x="${x.toFixed(1)}" y="${H - 3}" text-anchor="middle">${monthLabel(months[i], { month: "narrow" })}</text>`;
    }).join("");
    body.insertAdjacentHTML("beforeend", `<h3 class="t-h">Net by month</h3>
      <svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net payouts minus costs per month">
        <line x1="0" x2="${W}" y1="${mid}" y2="${mid}" style="stroke:var(--border)"/>${bars}</svg>`);

    // By firm
    const ids = [...new Set([...trading.firms.map(x => x.id), ...trading.payouts.map(x => x.firmId), ...trading.costs.map(x => x.firmId)])];
    if (ids.length) {
      body.insertAdjacentHTML("beforeend", `<h3 class="t-h">By firm</h3><div class="firm-table">${ids.map(id => {
        const p = payoutTotal(FIRST_DAY, todayKey, id), c = costTotal(FIRST_DAY, todayKey, id);
        return `<div><span>${firmName(id).replace(/</g, "&lt;")}</span><span>${money(p)} in</span><span>${money(c)} out</span><b>${signed(p - c)}</b></div>`;
      }).join("")}</div>`);
    }

    // Recent entries
    const recent = [...trading.payouts.map(x => ({ ...x, kind: "payout" })), ...trading.costs.map(x => ({ ...x, kind: "cost" }))]
      .sort((a, b) => b.date.localeCompare(a.date)).slice(0, 15);
    if (recent.length) {
      const wrap = document.createElement("div");
      wrap.className = "spend-list";
      wrap.innerHTML = "<b>Recent</b>";
      for (const e of recent) {
        const row = document.createElement("div");
        row.className = "spend-row weight-row";
        const text = document.createElement("span");
        text.textContent = `${e.kind === "payout" ? "💵" : "🧾"} ${shortDate(e.date)} · ${firmName(e.firmId)}${e.type ? ` · ${e.type}` : ""}`;
        const amt = document.createElement("span");
        amt.textContent = `${e.kind === "payout" ? "+" : "−"}${money(e.amount)}`;
        amt.style.color = e.kind === "payout" ? "var(--accent)" : "var(--danger)";
        const edit = document.createElement("button");
        edit.type = "button"; edit.className = "link"; edit.textContent = "Edit";
        edit.onclick = () => { tradingView.editEntry = { kind: e.kind, id: e.id }; renderTradingDialog(); };
        const del = document.createElement("button");
        del.type = "button"; del.className = "link danger"; del.textContent = "✕";
        del.onclick = () => {
          if (e.kind === "payout") trading.payouts = trading.payouts.filter(x => x.id !== e.id);
          else trading.costs = trading.costs.filter(x => x.id !== e.id);
          saveTrading(`Deleted ${e.kind} ${money(e.amount)}`); renderTradingDialog(); renderTrading();
        };
        row.append(text, amt, edit, del);
        wrap.append(row);
      }
      body.append(wrap);
    }
  }

  document.getElementById("addForm").onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById("habitName");
    const name = input.value.trim();
    if (!name) return;
    habits.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      name,
      color: document.getElementById("habitColor").value,
      ...(document.getElementById("habitFreq").value ? { weekly: Number(document.getElementById("habitFreq").value) } : {}),
      created: dayKey(startOfToday()),
      done: {}
    });
    input.value = "";
    document.getElementById("habitFreq").value = "";
    save(`Added ${name}`); render();
  };

  // ---- Monthly: goal, rating, progress photo ----
  // months[ym] = { goal, rating, reflection, prompted }
  const MONTHLY_KEY = "habit-tracker-monthly";
  let monthly = loadMonthly();
  function normalizeMonthly(data) { return { months: {}, ...(data || {}) }; }
  function loadMonthly() {
    try { return normalizeMonthly(JSON.parse(localStorage.getItem(MONTHLY_KEY))); } catch { return normalizeMonthly(); }
  }
  function saveMonthly(label, mergeKey) {
    try { localStorage.setItem(MONTHLY_KEY, JSON.stringify(monthly)); } catch {}
    commit(label, mergeKey);
  }
  const monthRec = ym => (monthly.months[ym] = monthly.months[ym] || {});

  // Progress photos live in IndexedDB (too big for localStorage), one per month.
  const PHOTO_DB = "habit-tracker-photos";
  function photoDb() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("no indexedDB")); return; }
      const req = indexedDB.open(PHOTO_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore("photos", { keyPath: "month" });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function photoStore(mode, fn) {
    const db = await photoDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("photos", mode);
      const req = fn(tx.objectStore("photos"));
      tx.oncomplete = () => resolve(req?.result);
      tx.onerror = () => reject(tx.error);
    });
  }
  const getPhotos = async () => ((await photoStore("readonly", s => s.getAll())) || []).sort((a, b) => a.month.localeCompare(b.month));
  const putPhoto = p => photoStore("readwrite", s => s.put(p)).then(r => { lastPhotoSync = 0; syncSoon(); return r; });
  const deletePhoto = month => photoStore("readwrite", s => s.delete(month));
  const clearPhotos = () => photoStore("readwrite", s => s.clear());

  // Shrinks a picture to at most 1080px wide as a JPEG.
  async function resizePhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const scale = Math.min(1, 1080 / img.naturalWidth);
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    } finally { URL.revokeObjectURL(url); }
  }
  const blobToDataUrl = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
  const dataUrlToBlob = async d => (await fetch(d)).blob();

  // Latest weigh-in during a month, for the photo captions.
  function weightInMonth(ym) {
    return sortedWeights().filter(e => e.date.slice(0, 7) === ym).pop() || null;
  }

  // ---- Look back ----
  // A read-only summary of any date range, built entirely from the data above.
  const lbView = { range: "3m", from: null, to: null };
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const monthsBetween = (fromYm, toYm) => { const out = []; for (let m = fromYm; m <= toYm; m = addMonths(m, 1)) out.push(m); return out; };
  function eachDay(from, to, fn) { for (let d = fromKey(from); dayKey(d) <= to; d = addDays(d, 1)) fn(dayKey(d), d); }
  const avg = list => list.length ? list.reduce((s, n) => s + n, 0) / list.length : null;
  const pctText = n => n === null || n === undefined ? "–" : `${Math.round(n)}%`;

  function lbRange() {
    const t = startOfToday(), today = dayKey(t);
    const r = lbView.range;
    if (r === "custom" && lbView.from && lbView.to) return [lbView.from, lbView.to > today ? today : lbView.to];
    if (r === "year") return [`${t.getFullYear()}-01-01`, today];
    if (r === "all") {
      const starts = [...habits.map(h => dayKey(trackingStart(h))), spendStart(), ...Object.keys(work.hours), ...weight.entries.map(e => e.date), ...Object.keys(trading.days)].filter(Boolean).sort();
      return [starts[0] || today, today];
    }
    const months = r === "6m" ? 6 : 3;
    return [dayKey(new Date(t.getFullYear(), t.getMonth() - months, t.getDate() + 1)), today];
  }

  // Streak, completion and comebacks for one habit inside [from, to].
  // Streaks only count the part that falls inside the range.
  function habitRange(h, from, to) {
    const start = trackingStart(h), today = startOfToday();
    let run = 0, runIn = 0, longest = 0, done = 0, total = 0, comebacks = 0, brokeAt = null, fastest = null;
    const startRun = (at, inRange) => {
      if (run === 0 && brokeAt) {
        if (inRange) {
          comebacks++;
          const gap = Math.max(Math.round(daysBetween(brokeAt, at) / (h.weekly ? 7 : 1)), 1);
          fastest = fastest === null ? gap : Math.min(fastest, gap);
        }
        brokeAt = null;
      }
    };
    const breakRun = at => { if (run > 0) brokeAt = at; run = 0; runIn = 0; };
    if (h.weekly) {
      const cur = weekStartOf(today);
      for (let ws = weekStartOf(start); dayKey(ws) <= to; ws = addDays(ws, 7)) {
        const inRange = dayKey(addDays(ws, 6)) >= from;
        const ongoing = +ws === +cur;
        if (weekMet(h, ws)) {
          startRun(ws, inRange);
          run++;
          if (inRange) { runIn++; longest = Math.max(longest, runIn); done++; total++; }
        } else if (!ongoing) { if (inRange) total++; breakRun(ws); }
      }
    } else {
      for (let d = start; dayKey(d) <= to; d = addDays(d, 1)) {
        const k = dayKey(d), inRange = k >= from;
        if (isDone(h, k)) {
          startRun(d, inRange);
          run++;
          if (inRange) { runIn++; longest = Math.max(longest, runIn); done++; total++; }
        } else if (skipDay(h, k) || +d === +today) continue;
        else { if (inRange) total++; breakRun(d); }
      }
    }
    return { longest, pct: total ? done / total * 100 : null, done, total, comebacks, fastest };
  }

  function lbBars(items, { color = "var(--accent)", fmt = v => v, signed = false } = {}) {
    if (!items.length) return "";
    const W = 320, H = 120, B = 16, T = 14;
    const max = Math.max(1, ...items.map(i => Math.abs(i.v)));
    const mid = signed ? (H - B + T) / 2 : H - B;
    const span = signed ? (H - B - T) / 2 : H - B - T;
    const bw = Math.min(26, W / items.length * 0.62);
    return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img">
      ${signed ? `<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" style="stroke:var(--border)"/>` : ""}
      ${items.map((it, i) => {
        const x = (i + 0.5) * W / items.length, h = Math.abs(it.v) / max * span;
        const y = it.v >= 0 ? mid - h : mid;
        const c = typeof color === "function" ? color(it.v) : color;
        return `<rect x="${(x - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" style="fill:${c}"><title>${esc(it.title || it.label)}: ${esc(fmt(it.v))}</title></rect>
          <text x="${x.toFixed(1)}" y="${H - 3}" text-anchor="middle">${esc(it.label)}</text>`;
      }).join("")}
    </svg>`;
  }

  // Per-month numbers used by best/worst and then-vs-now.
  function monthMetrics(ym) {
    const from = `${ym}-01`, last = `${ym}-31`, today = dayKey(startOfToday());
    const to = last > today ? today : last;
    const pcts = habits.map(h => habitRange(h, from, to).pct).filter(p => p !== null);
    const bed = habits.find(h => h.sleep === "bed"), wake = habits.find(h => h.sleep === "wake"), scr = habits.find(h => h.screen);
    const nights = [], screen = [];
    eachDay(from, to, (k, d) => {
      const b = bed?.log?.[k], w = wake?.log?.[dayKey(addDays(d, 1))];
      if (b && w) nights.push((toMin(w) + 1440 - toMin(b)) % 1440);
      if (scr?.minutes?.[k] !== undefined) screen.push(scr.minutes[k]);
    });
    const ts = tradingStats(from, to).all;
    const w = weightInMonth(ym);
    return { ym, habits: avg(pcts), sleep: avg(nights), screen: avg(screen), spent: spentBetween(from, to), weight: w ? w.lbs : null, green: ts.n ? ts.pct : null, r: ts.n ? ts.r : null, tradeDays: ts.n };
  }

  async function renderLookback() {

    const badgeChips = badgesIn.length ? `<div class="badge-row" style="margin-top:12px">${badgesIn.map(b => `<span class="badge earned">${b.icon} ${esc(b.label)} <small>${esc(b.group)}</small></span>`).join("")}</div>` : "";
    parts.push(card("Habits", (rows || `<p class="hint">No habit data in this range yet.</p>`) + badgeChips));

    // ---- Health ----
    const H = n => habits.find(n);
    const workout = H(h => h.workout), bible = H(h => h.bible), bed = H(h => h.sleep === "bed"), wake = H(h => h.sleep === "wake"), scr = H(h => h.screen), water = H(h => h.water);
    let workouts = 0, minutes = 0, chapters = 0;

    eachDay(from, to, (k, d) => {
      if (workout && isDone(workout, k)) { workouts++; minutes += workout.details?.[k]?.minutes || 0; }
      if (bible) chapters += Math.min(count(bible, k), target(bible));
      const b = bed?.log?.[k], w = wake?.log?.[dayKey(addDays(d, 1))];
      if (b && w) nights.push((toMin(w) + 1440 - toMin(b)) % 1440);
      if (b) bedLogged.push(isDone(bed, k));

    });

    const wIn = sortedWeights().filter(e => e.date >= from && e.date <= to);

    parts.push(card("Health", `<div class="lb-tiles">

      const eatBars = months.map(m => ({ label: monthLabel(m, { month: "narrow" }), title: monthLabel(m, { month: "long", year: "numeric" }), v: categoryTotals(`${m}-01`, `${m}-31`).Food || 0 }));

    const catMax = cats[0]?.[1] || 1;
    parts.push(card("Money", `<div class="lb-tiles">

    // ---- Trading ----
    const ts = tradingStats(from, to);
    const tradeHabits = habits.filter(h => h.trading).map(h => ({ h, ...habitRange(h, from, to) }));
    const anyTrading = ts.all.n || trading.payouts.length || trading.costs.length || trading.firms.length;

      const accts = trading.firms.some(f => f.history?.length) ? lineChart(months.map(m => ({ label: monthLabel(m, { month: "narrow" }), a: accountsAt(m).active, b: accountsAt(m).funded })), "Active", "Funded").outerHTML : "";
      parts.push(card("Trading", `<div class="lb-tiles">
          ${tile(ts.all.n ? `${ts.all.pct}%` : "–", "green days", `${ts.all.green} of ${ts.all.n}`)}
          ${tile(ts.all.n ? signedR(ts.all.r) : "–", "total R", ts.all.n ? `${signedR(ts.all.avg)} avg / day` : "")}
          ${tile(ts.followed.n ? signedR(ts.followed.avg) : "–", "avg R, followed plan", `${ts.followed.n} days`)}

        ${accts}`));

    // ---- Best and worst months ----
    const mm = months.map(monthMetrics);
    // A month only 1–9 days old is too thin to judge, so it's left out until day 10.
    const fullMonths = mm.filter(m => !(m.ym === today.slice(0, 7) && startOfToday().getDate() < 10));
    const pick = (key, better) => {
      const list = fullMonths.filter(m => m[key] !== null && (key !== "spent" || m.spent > 0));
      if (list.length < 2) return null;
      const sorted = [...list].sort((a, b) => better === "high" ? b[key] - a[key] : a[key] - b[key]);

    const bw = [
      ["Habits", pick("habits", "high"), m => pctText(m.habits)],

    // ---- Then vs now ----
    // Each line compares the first and last months in the range that have that kind of data.

        <div><b>${esc(r.goal || "No goal set")}</b>${r.rating ? `<span class="lb-stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span>` : ""}${r.reflection ? `<p>${esc(r.reflection)}</p>` : ""}</div></div>`;
    }).join("");
    // Highlights: the longest journal entries from the best-rated months.
    const rated = months.filter(m => monthly.months[m]?.rating >= 4).sort((x, y) => monthly.months[y].rating - monthly.months[x].rating).slice(0, 3);
    const hl = jh ? rated.map(m => Object.entries(jh.journalText || {}).filter(([k]) => k.slice(0, 7) === m && k >= from && k <= to).sort((x, y) => y[1].length - x[1].length)[0]).filter(Boolean) : [];
    if (tl || hl.length) {
      parts.push(card("Monthly timeline", (tl || "") + (hl.length ? `<h4>✨ From your best months</h4>${hl.map(([k, text]) =>
        `<blockquote class="lb-quote">${esc(text.length > 280 ? text.slice(0, 280) + "…" : text)}<cite>${fmtD(k)}</cite></blockquote>`).join("")}` : "")));
    }

    body.innerHTML = parts.join("");

    // Photos load from IndexedDB after the rest is on screen.
    try {
      const photos = (await getPhotos()).filter(p => p.month >= from.slice(0, 7) && p.month <= to.slice(0, 7));
      const box = document.getElementById("lbPhotos");
      if (box && photos.length) {
        const img = p => `<figure><img src="${URL.createObjectURL(p.blob)}" alt="Progress photo ${esc(monthLabel(p.month, { month: "long", year: "numeric" }))}"><figcaption>${monthLabel(p.month, { month: "short", year: "numeric" })}${weightInMonth(p.month) ? ` · ${lbs(weightInMonth(p.month).lbs)}` : ""}</figcaption></figure>`;
        const first = photos[0], last = photos[photos.length - 1];
        box.innerHTML = `<h4>📸 Progress photos</h4>
          ${photos.length > 1 ? `<div class="lb-photo-pair">${img(first)}${img(last)}</div>` : ""}

  // ---- Reset today ----
  // Clears today's check-offs, counts, answers, times, workouts and excused marks for every
  // habit. Journal entries and notes are kept; one Undo brings everything back.
  function resetToday() {
    const k = dayKey(startOfToday());
    const touched = habits.filter(h => !h.journal && (k in h.done || h.answers?.[k] || h.log?.[k] || h.minutes?.[k] !== undefined || h.details?.[k] || h.excused?.[k]));
    if (!touched.length) { alert("Nothing has been logged for today yet."); return; }
    if (!confirm(`Reset today for ${touched.length} habit${touched.length === 1 ? "" : "s"}? Your journal and notes stay. You can undo this.`)) return;
    for (const h of touched) {
      // Chapters tapped today come back off the Bible bookmark.
      if (h.bible) h.position = Math.max((h.position || 0) - Math.min(count(h, k), target(h)), 0);
      delete h.done[k];
      for (const field of ["answers", "log", "minutes", "details", "excused"]) if (h[field]) delete h[field][k];
