          const goalOz = target(h) * h.ozPerGlass;
          // Logged days keep the same oz too.
          for (const [k, g] of Object.entries(h.done)) if (typeof g === "number") h.done[k] = Math.round(g * h.ozPerGlass / v * 100) / 100;
          h.ozPerGlass = v;
          h.target = goalOz / v;
          save("Changed glass size"); render();
        };
        row.append(oz, " oz");
        top.append(row);
      }

      // Last 7 days, oldest first, today on the right.
      const week = document.createElement("div");
      week.className = "week";
      for (let i = 6; i >= 0; i--) {
        const d = addDays(today, -i);
        const key = dayKey(d);
        const c = count(h, key), done = isDone(h, key);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day" + (done ? " done" : "") + (i === 0 ? " is-today" : "");
        const logged = h.sleep && h.log?.[key];
        const screenMin = h.screen ? h.minutes?.[key] : undefined;
        const detail = h.details?.[key], note = h.notes?.[key];
        const excused = isExcused(h, key) && !done;
        const ans = h.question ? answerOf(h, key) : null;
        const offDay = h.trading && !isTradingDay(key);
        const suggest = !ans && suggestedAnswer(h, key);
        btn.title = [
          d.toLocaleDateString(),
          excused && "Excused",
          offDay && "Not a trading day",
          h.question && (ans ? `Answered ${ans === "yes" ? "Yes" : "No"}` : suggest ? `Not answered — suggested ${suggest === "yes" ? "Yes" : "No"}` : "Not answered"),
          h.journal && h.journalText?.[key] && `“${h.journalText[key].slice(0, 60)}${h.journalText[key].length > 60 ? "…" : ""}”`,
          h.water ? `${waterShown(h, c)}/${waterShown(h, target(h))} ${waterUnitLabel(h)} — tap to set, hold to remove one`
            : target(h) > 1 && `${c}/${target(h)} ${h.unit || ""}`,
          logged && (done ? `${shortClock(logged)} — on time` : `${shortClock(logged)} — ${minutesOff(h, logged)} min late`),
          screenMin !== undefined && `${duration(screenMin)} — ${done ? "under" : "over"} your ${duration(h.limit)} limit`,
          detail && [detail.activity, detail.minutes && `${detail.minutes} min`].filter(Boolean).join(", "),
          note
        ].filter(Boolean).join(" · ");
        // Sleep habits show the logged time; late times get a red ring.
        let style, label, small = false;
        if (offDay && !done) {
          style = "color:var(--muted);opacity:.5"; label = "–";
        } else if (h.question && ans && !done) {
          // Answered the bad way.
          style = "box-shadow:inset 0 0 0 3px var(--danger);color:var(--danger)"; label = "✗";
        } else if (suggest && !excused) {
          style = "box-shadow:inset 0 0 0 3px #f59e0b;color:#f59e0b"; label = "?";
        } else if (excused) {
          // Excused days show a grey dot.
          style = "color:var(--muted);font-size:22px"; label = "•";
        } else if (logged || screenMin !== undefined) {
          style = done ? `background:${h.color}` : `box-shadow:inset 0 0 0 3px var(--danger);color:var(--danger)`;
          label = logged ? shortClock(logged) : shortDur(screenMin); small = true;
        } else if (h.water && c && !done) {
          // A ring that fills partway around as the day's water adds up.
          const pct = Math.min(c / target(h) * 100, 100);
          style = `background:radial-gradient(var(--card) 58%, transparent 60%),conic-gradient(${h.color} ${pct}%, var(--empty) 0);color:${h.color}`;
          label = `${waterShown(h, c)}/${waterShown(h, target(h))}`; small = true;
        } else {
          style = done ? `background:${h.color}`
            : c ? `box-shadow:inset 0 0 0 3px ${h.color};color:${h.color}` : "";
          label = c && !done ? `${c}/${target(h)}` : "✓";
          small = !!(c && !done);
        }
        btn.innerHTML = `<small>${i === 0 ? "Today" : d.toLocaleDateString(undefined, { weekday: "short" })}</small>
          <span class="check${small ? " partial" : ""}${(logged || screenMin !== undefined) && done ? " timed" : ""}" style="${style}">${label}</span>
          <span class="note-dot" style="${detail || note ? `background:${h.color}` : ""}"></span>`;
        if (editing && editing.id === h.id && editing.key === key) btn.classList.add("selected");
        btn.onclick = () => h.journal ? openJournal(key)
          : h.sleep || h.screen || h.water || h.question ? openEditor(h.id, key) : toggle(h.id, key);
        if (h.water) attachLongPress(btn, () => addWater(h, key, -1));
        week.append(btn);
      }

      const heat = buildHeat(h, today);

      const foot = document.createElement("div");
      foot.className = "habit-foot";
      const si = streakInfo(h), longest = si.longest;
      // After a streak breaks, the new one is a comeback.
      const back = si.backOn ? ` · <b class="back-on">Back on it: ${si.current} ${streakUnit(h, si.current)}</b>` : "";
      foot.innerHTML = `<span class="rate">${h.weekly ? "Last 4 weeks" : "30-day"}: ${rate(h, 30)}% · Longest streak: ${longest} ${streakUnit(h, longest)}${back}</span>`;
      const actions = document.createElement("span");
      const detailsBtn = document.createElement("button");
      detailsBtn.className = "link";
      detailsBtn.textContent = h.workout ? "Log workout" : h.sleep || h.screen ? "Log time" : h.water ? "Set amount"
        : h.question ? "Answer a day" : h.journal ? "Edit a day" : "Add note";
      // Going to bed after midnight still counts as the night before.
      detailsBtn.onclick = () => openEditor(h.id,
        dayKey(h.sleep === "bed" && new Date().getHours() < 12 ? addDays(today, -1) : today));
      actions.append(detailsBtn);
      if (h.bible) {
        const placeBtn = document.createElement("button");
        placeBtn.className = "link";
        placeBtn.textContent = "Set place";
        placeBtn.onclick = () => {
          const text = prompt("What's the last chapter you finished? (e.g. John 3)\nType 0 to start from Genesis 1.",
            h.position ? chapterAt(h.position - 1) || "Revelation 22" : "");
          if (text === null) return;
          const pos = text.trim() === "0" ? 0 : parseChapter(text);
          if (pos === null) { alert("I couldn't find that chapter. Try something like “Genesis 12” or “1 John 3”."); return; }
          h.position = pos; save("Moved Bible bookmark"); render();
        };
        actions.append(placeBtn);
      }
      const renameBtn = document.createElement("button");
      renameBtn.className = "link";
      renameBtn.textContent = "Edit";
      renameBtn.onclick = () => { settingsFor = settingsFor === h.id ? null : h.id; editing = null; render(); };
      const delBtn = document.createElement("button");
      delBtn.className = "link danger";
      delBtn.textContent = "Delete";
      delBtn.onclick = () => {
        if (confirm(`Delete "${h.name}" and its history?`)) {
          habits = habits.filter(x => x.id !== h.id); save(`Deleted ${h.name}`); render();
        }
      };
      actions.append(renameBtn, delBtn);
      foot.append(actions);

      el.append(top, week);
      if (h.water) {
        const row = document.createElement("div");
        row.className = "water-row";
        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Remove one glass");
        minus.disabled = !count(h, todayKey);
        minus.onclick = () => addWater(h, todayKey, -1);
        const plus = document.createElement("button");
        plus.type = "button";
        plus.className = "primary water-plus";
        plus.style.background = plus.style.borderColor = h.color;
        plus.textContent = inOz(h) ? `💧 +1 glass (${h.ozPerGlass} oz)` : "💧 +1 glass";
        plus.onclick = () => addWater(h, todayKey, 1);
        row.append(minus, plus);
        el.append(row);
      }
      if (h.question && !(h.trading && !isTradingDay(todayKey))) el.append(questionRow(h, todayKey));
      if (h.journal) {
        const row = document.createElement("div");
        row.className = "journal-row";
        const open = document.createElement("button");
        open.type = "button";
        open.className = "primary";
        open.style.background = open.style.borderColor = h.color;
        open.textContent = "📝 Open today's journal";
        open.onclick = () => openJournal(todayKey);
        const preview = document.createElement("span");
        preview.className = "hint";
        preview.textContent = h.journalText?.[todayKey] ? `“${h.journalText[todayKey].slice(0, 80)}${h.journalText[todayKey].length > 80 ? "…" : ""}”` : "Nothing written today yet.";
        row.append(open, preview);
        el.append(row);
      }
      if (h.sleep || h.workout || h.screen || h.water || h.question) {
        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = h.sleep ? "Tap a day to log the time — it's checked off when you're on time."
          : h.screen ? "Tap a day to enter your phone's screen time — it's checked off when you stay under your limit."
          : h.water ? "Tap a day to set its amount, or press and hold a day to take off one glass."
          : h.question ? "Tap a day to answer it. Unanswered days stay blank until you do."
          : "Tap a day to check it off, or “Log workout” to record what you did.";
        el.append(hint);
      }
      if (settingsFor === h.id) el.append(buildSettings(h));
      if (editing && editing.id === h.id) el.append(buildEditor(h));
      const info = h.bible ? bibleLine(h)
        : h.sleep === "wake" ? sleepLine()
        : h.screen ? screenLine(h)
        : h.water ? waterLine(h)
        : h.eatingOut ? eatingOutLine()
        : h.workout ? workoutLine(h) : "";
      if (info) {
        const line = document.createElement("div");
        line.className = "info";
        line.innerHTML = info;
        el.append(line);
      }
      el.append(heat, foot);
      list.append(el);
    }
    // Start each history grid at the latest week; scroll left to go back in time.
    requestAnimationFrame(() => list.querySelectorAll(".heat-wrap").forEach(w => { w.scrollLeft = w.scrollWidth; }));
    renderLastChance();
    checkCelebrations();
  }

  // Work hours live apart from habits: hours per day, plus pay rates that each
  // start on a given day, so a raise doesn't rewrite what earlier days paid.
  const WORK_KEY = "habit-tracker-work";
  let work = loadWork();

  function loadWork() {
    try { return JSON.parse(localStorage.getItem(WORK_KEY)) || { rates: [], hours: {} }; }
    catch { return { rates: [], hours: {} }; }
  }
  function saveWork(label, mergeKey) {
    try { localStorage.setItem(WORK_KEY, JSON.stringify(work)); } catch {}
    commit(label, mergeKey);
  }

  const FIRST_DAY = "0000-01-01";
  function rateOn(key) {
    let r = 0;
    for (const x of work.rates) if (x.from <= key) r = x.rate;
    return r;
  }
  function workTotals(fromKey, toKey = dayKey(startOfToday())) {
    let hours = 0, pay = 0;
    for (const [k, h] of Object.entries(work.hours)) {
      if (k >= fromKey && k <= toKey) { hours += h; pay += h * rateOn(k); }
    }
    return { hours, pay };
  }

  // Pay periods. Weekly and every-two-weeks periods count from an anchor day you
  // choose (your first day of a pay period); the others follow the calendar.
  const PERIODS = { weekly: "Weekly", biweekly: "Every 2 weeks", semimonthly: "Twice a month (1st & 16th)", monthly: "Monthly" };
  const payPeriod = () => work.period || { type: "weekly", anchor: "2026-01-05" }; // a Monday
  const fromKey = k => new Date(k + "T00:00:00");
  // Whole days between two local dates, immune to daylight-saving shifts.
  const daysBetween = (a, b) =>
    Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);

  function periodRange(d) {
    const { type, anchor } = payPeriod();
    if (type === "weekly" || type === "biweekly") {
      const len = type === "weekly" ? 7 : 14;
      const start = addDays(fromKey(anchor), Math.floor(daysBetween(fromKey(anchor), d) / len) * len);
      return [start, addDays(start, len - 1)];
    }
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    if (type === "monthly") return [first, last];
    return d.getDate() <= 15 ? [first, new Date(d.getFullYear(), d.getMonth(), 15)]
      : [new Date(d.getFullYear(), d.getMonth(), 16), last];
  }

  let workWeeksBack = 0;
  const money = n => n.toLocaleString(undefined, { style: "currency", currency: "USD" });
  const hrs = n => `${+n.toFixed(2)} h`;
  const shortDate = k => new Date(k + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });

  function renderWork() {
    const today = startOfToday();
    const todayKey = dayKey(today);
    const sec = document.getElementById("work");
    sec.innerHTML = `
      <div class="habit">
        <div class="habit-top">
          <span class="dot" style="background:#0891b2"></span>
          <span class="name">Work hours</span>
          <span class="streak" id="rateNow"></span>
        </div>
        <div class="rate-row">
          <label>Rate $ <input type="number" id="rateInput" min="0" step="0.01" placeholder="0.00"></label>
          <span>/hr</span>
          <label id="rateFromWrap">starting <input type="date" id="rateFrom"></label>
          <button type="button" id="rateSave">Set rate</button>
        </div>
        <div class="rate-row">
          <label>Pay period <select id="periodType"></select></label>
          <label id="anchorWrap">a period starts on <input type="date" id="periodAnchor"></label>
        </div>
        <div class="week-nav">
          <button type="button" class="link" id="workPrev" aria-label="Previous week">‹ Earlier</button>
          <span id="workRange"></span>
          <button type="button" class="link" id="workNext" aria-label="Next week">Later ›</button>
        </div>
        <div class="week" id="workWeek"></div>
        <div class="work-totals" id="workTotals"></div>
        <div class="rate" id="rateHistory" style="margin-top:8px"></div>
      </div>`;

    const periodType = document.getElementById("periodType");
    for (const [v, label] of Object.entries(PERIODS)) periodType.append(new Option(label, v));
    const periodAnchor = document.getElementById("periodAnchor");
    periodType.value = payPeriod().type;
    periodAnchor.value = payPeriod().anchor;
    document.getElementById("anchorWrap").hidden = !["weekly", "biweekly"].includes(payPeriod().type);
    const savePeriod = () => {
      work.period = { type: periodType.value, anchor: periodAnchor.value || payPeriod().anchor };
      saveWork("Changed pay period"); renderWork();
    };
    periodType.onchange = savePeriod;
    periodAnchor.onchange = savePeriod;

    document.getElementById("workPrev").onclick = () => { workWeeksBack++; renderWork(); };
    document.getElementById("workNext").onclick = () => { workWeeksBack = Math.max(workWeeksBack - 1, 0); renderWork(); };
    document.getElementById("workNext").disabled = workWeeksBack === 0;
    const end = addDays(today, -7 * workWeeksBack);
    document.getElementById("workRange").textContent = workWeeksBack === 0 ? "Last 7 days"
      : `${shortDate(dayKey(addDays(end, -6)))} – ${shortDate(dayKey(end))}`;

    const rateInput = document.getElementById("rateInput");
    const rateFrom = document.getElementById("rateFrom");
    if (work.rates.length) rateInput.value = rateOn(todayKey).toFixed(2);
    // The first rate covers every day; the start date only matters once there's a rate to change from.
    document.getElementById("rateFromWrap").hidden = !work.rates.length;
    rateFrom.value = todayKey;
    document.getElementById("rateSave").onclick = () => {
      const rate = parseFloat(rateInput.value);
      if (isNaN(rate) || rate < 0) return;
      const from = work.rates.length ? rateFrom.value || todayKey : FIRST_DAY;
      work.rates = work.rates.filter(r => r.from !== from);
      work.rates.push({ from, rate });
      work.rates.sort((a, b) => a.from.localeCompare(b.from));
      saveWork(`Set rate to ${money(rate)}/hr`); renderWork();
    };

    const week = document.getElementById("workWeek");
    for (let i = 6; i >= 0; i--) {
      const d = addDays(end, -i);
      const key = dayKey(d);
      const isToday = key === todayKey;
      const cell = document.createElement("label");
      cell.className = "day" + (isToday ? " is-today" : "");
      cell.innerHTML = `<small>${isToday ? "Today" : d.toLocaleDateString(undefined,
        workWeeksBack ? { weekday: "short", day: "numeric" } : { weekday: "short" })}</small>`;
      const input = document.createElement("input");
      input.type = "number";
      input.className = "hours-input";
      input.min = 0; input.max = 24; input.step = 0.25;
      input.inputMode = "decimal";
      input.placeholder = "–";
      input.title = d.toLocaleDateString();
      if (work.hours[key]) input.value = work.hours[key];
      input.oninput = () => {
        const v = parseFloat(input.value);
        if (!v || v < 0) delete work.hours[key];
        else work.hours[key] = Math.min(v, 24);
        // Typing several digits is one change for Undo.
        saveWork(`Updated hours for ${shortDate(key)}`, `hours-${key}`); updateWorkTotals();
      };
      cell.append(input);
      week.append(cell);
    }

    const hist = document.getElementById("rateHistory");
    hist.textContent = work.rates.length > 1
      ? "Rate history: " + work.rates.map(r =>
          `${money(r.rate)}${r.from === FIRST_DAY ? " at first" : " from " + shortDate(r.from)}`).join(" · ")
      : "";

    updateWorkTotals();
  }

  function updateWorkTotals() {
    const today = startOfToday();
    const todayKey = dayKey(today);
    const rate = rateOn(todayKey);
    document.getElementById("rateNow").textContent = work.rates.length ? `${money(rate)}/hr` : "Set your rate";
    const [curStart, curEnd] = periodRange(today);
    const [lastStart, lastEnd] = periodRange(addDays(curStart, -1));
    const range = (a, b) => `${shortDate(dayKey(a))} – ${shortDate(dayKey(b))}`;
    const periods = [
      ["This pay period", range(curStart, curEnd), dayKey(curStart), todayKey],
      ["Last pay period", range(lastStart, lastEnd), dayKey(lastStart), dayKey(lastEnd)],
      ["This month", "", todayKey.slice(0, 8) + "01", todayKey],
      ["All time", "", FIRST_DAY, todayKey]
    ];
    document.getElementById("workTotals").innerHTML = periods.map(([label, sub, from, to]) => {
      const t = workTotals(from, to);
      return `<div><b>${money(t.pay)}</b>${label} · ${hrs(t.hours)}${sub ? `<br><span class="sub">${sub}</span>` : ""}</div>`;
    }).join("");
  }

  // ---- Weekly weight ----
  // Weeks start on the weigh-in day; any weigh-in during that week counts for it.
  const WEIGHT_KEY = "habit-tracker-weight";
  const WEIGHT_COLOR = "#4f46e5";
  const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  let weight = loadWeight();
  // View-only state for the weight card (not saved).
  const weightView = { editId: null, showAll: false };

  function loadWeight() {
    let data;
    try { data = JSON.parse(localStorage.getItem(WEIGHT_KEY)); } catch {}
    return { weighDay: 1, goal: null, entries: [], ...(data || {}) };
  }
  function saveWeight(label, mergeKey) {
    try { localStorage.setItem(WEIGHT_KEY, JSON.stringify(weight)); } catch {}
    commit(label, mergeKey);
  }

  const sortedWeights = () => [...weight.entries].sort((a, b) => a.date.localeCompare(b.date));
  const lbs = n => `${+n.toFixed(1)} lbs`;
  const weekOf = d => addDays(d, -((d.getDay() - weight.weighDay + 7) % 7));
  const weighedWeeks = () => new Set(weight.entries.map(e => dayKey(weekOf(fromKey(e.date)))));

  function weightStreak() {
    const weeks = weighedWeeks();
    let w = weekOf(startOfToday());
    // This week not weighed yet doesn't break the streak; count from last week.
    if (!weeks.has(dayKey(w))) w = addDays(w, -7);
    let n = 0;
    while (weeks.has(dayKey(w))) { n++; w = addDays(w, -7); }
    return n;
  }
  const weighedThisWeek = () => weighedWeeks().has(dayKey(weekOf(startOfToday())));
  const weighInDueToday = () => startOfToday().getDay() === weight.weighDay && !weighedThisWeek();

  // ▲/▼ change, green when it moves toward the goal (or down when there's no goal).
  function changeHtml(diff, from) {
    if (Math.abs(diff) < 0.05) return `<span class="muted">no change</span>`;
    const good = weight.goal ? Math.abs(from + diff - weight.goal) < Math.abs(from - weight.goal) : diff < 0;
    return `<span style="color:${good ? "var(--accent)" : "var(--danger)"}">${diff < 0 ? "▼" : "▲"} ${lbs(Math.abs(diff))}</span>`;
  }

  // Plain SVG line chart of the last 12 weeks.
  function weightChart() {
    const today = startOfToday();
    const start = addDays(today, -83);
    const pts = sortedWeights().filter(e => e.date >= dayKey(start));
    if (pts.length < 2) return `<div class="hint" style="margin:10px 0">Log at least 2 weigh-ins in the last 12 weeks to see a chart.</div>`;
    const W = 320, H = 140, L = 38, R = 10, T = 12, B = 22;
    const vals = pts.map(p => p.lbs);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    // Show the goal line when it's reasonably close to the data.
    const showGoal = weight.goal && weight.goal > lo - 15 && weight.goal < hi + 15;
    if (showGoal) { lo = Math.min(lo, weight.goal); hi = Math.max(hi, weight.goal); }
    if (hi - lo < 2) { lo -= 1; hi += 1; }
    const span = 83;
    const x = k => L + daysBetween(start, fromKey(k)) / span * (W - L - R);
    const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    const line = pts.map(p => `${x(p.date).toFixed(1)},${y(p.lbs).toFixed(1)}`).join(" ");
    const dots = pts.map(p => `<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.lbs).toFixed(1)}" r="3" style="fill:${WEIGHT_COLOR}"><title>${shortDate(p.date)}: ${lbs(p.lbs)}</title></circle>`).join("");
    const goal = showGoal ? `<line x1="${L}" x2="${W - R}" y1="${y(weight.goal)}" y2="${y(weight.goal)}" style="stroke:var(--accent)" stroke-dasharray="4 4"/>
      <text x="${W - R}" y="${y(weight.goal) - 4}" text-anchor="end" style="fill:var(--accent)">goal</text>` : "";
    return `<svg class="weight-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over the last 12 weeks">
      <line x1="${L}" x2="${W - R}" y1="${y(hi)}" y2="${y(hi)}" style="stroke:var(--border)"/>
      <line x1="${L}" x2="${W - R}" y1="${y(lo)}" y2="${y(lo)}" style="stroke:var(--border)"/>
      <text x="${L - 6}" y="${y(hi) + 4}" text-anchor="end">${+hi.toFixed(1)}</text>
      <text x="${L - 6}" y="${y(lo) + 4}" text-anchor="end">${+lo.toFixed(1)}</text>
      <text x="${L}" y="${H - 6}">${shortDate(dayKey(start))}</text>
      <text x="${W - R}" y="${H - 6}" text-anchor="end">Today</text>
      ${goal}
      <polyline points="${line}" fill="none" style="stroke:${WEIGHT_COLOR}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>`;
  }

  function renderWeight() {
    const today = startOfToday();
    const todayKey = dayKey(today);
    const list = sortedWeights();
    const latest = list[list.length - 1], prev = list[list.length - 2], first = list[0];
    const streak = weightStreak();
    const status = weighInDueToday() ? `<span class="due">Weigh-in due</span>`
      : weighedThisWeek() ? "✓ Weighed in this week"
      : `Next weigh-in: ${WEEKDAYS[weight.weighDay]}`;

    const sec = document.getElementById("weight");
    sec.innerHTML = `
      <div class="habit">
        <div class="habit-top">
          <span class="dot" style="background:${WEIGHT_COLOR}"></span>
          <span class="name">Weekly weight</span>
          <span class="streak">${streak ? `🔥 ${streak} week${streak === 1 ? "" : "s"}` : "No streak"}</span>
        </div>
        <div class="hint" style="margin:6px 0 0">${status}</div>
        <form class="rate-row" id="weightForm">
          <label><input type="number" id="weightLbs" min="1" max="1500" step="0.1" inputmode="decimal" placeholder="0.0" required style="width:90px"> lbs</label>
          <input type="date" id="weightDate">
          <button type="submit" class="primary" id="weightSubmit">Log weight</button>
          <button type="button" class="link" id="weightCancel" hidden>Cancel</button>
        </form>
        ${latest ? `<div class="work-totals" style="margin-top:12px">
          <div><b>${lbs(latest.lbs)}</b>Latest · ${shortDate(latest.date)}</div>
          <div><b>${prev ? changeHtml(latest.lbs - prev.lbs, prev.lbs) : "—"}</b>Since last weigh-in</div>
          <div><b>${list.length > 1 ? changeHtml(latest.lbs - first.lbs, first.lbs) : "—"}</b>Since first (${shortDate(first.date)})</div>
        </div>` : ""}
        ${weightChart()}
        <div class="rate-row">
          <label>Weigh-in day <select id="weighDay"></select></label>
          <label>Goal <input type="number" id="weightGoal" min="1" step="0.1" placeholder="none" style="width:80px"> lbs</label>
          <span id="weightToGo"></span>
        </div>
        <div id="weightList"></div>
      </div>`;

    const lbsIn = document.getElementById("weightLbs");
    const dateIn = document.getElementById("weightDate");
    dateIn.value = todayKey;
    dateIn.max = todayKey;
    const editEntry = weightView.editId && weight.entries.find(e => e.id === weightView.editId);
    if (editEntry) {
      lbsIn.value = editEntry.lbs;
      dateIn.value = editEntry.date;
      document.getElementById("weightSubmit").textContent = "Save";
      document.getElementById("weightCancel").hidden = false;
    }
    document.getElementById("weightCancel").onclick = () => { weightView.editId = null; renderWeight(); };
    document.getElementById("weightForm").onsubmit = e => {
      e.preventDefault();
      const v = Math.round(parseFloat(lbsIn.value) * 10) / 10;
      const date = dateIn.value || todayKey;
      if (!(v > 0)) return;
      // One weigh-in per date: logging on a date that already has one replaces it.
      weight.entries = weight.entries.filter(x => x.date !== date || x.id === weightView.editId);
      const existing = weight.entries.find(x => x.id === weightView.editId);
      if (existing) Object.assign(existing, { lbs: v, date });
      else weight.entries.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), date, lbs: v });
      weightView.editId = null;
      saveWeight(`Logged ${lbs(v)} (${shortDate(date)})`); renderWeight();
    };

    const day = document.getElementById("weighDay");
    WEEKDAYS.forEach((d, i) => day.append(new Option(d, i)));
    day.value = weight.weighDay;
    day.onchange = () => { weight.weighDay = Number(day.value); saveWeight("Changed weigh-in day"); renderWeight(); };

    const goal = document.getElementById("weightGoal");
    if (weight.goal) goal.value = weight.goal;
    goal.onchange = () => { weight.goal = parseFloat(goal.value) > 0 ? parseFloat(goal.value) : null; saveWeight("Changed goal weight"); renderWeight(); };
    if (weight.goal && latest) {
      const left = Math.abs(latest.lbs - weight.goal);
      document.getElementById("weightToGo").innerHTML = left < 0.05 ? "🎉 Goal reached" : `<b>${lbs(left)}</b> to go`;
    }

    const shown = [...list].reverse();
    if (shown.length) {
      const wrap = document.createElement("div");
      wrap.className = "spend-list";
      wrap.innerHTML = "<b>Weigh-ins</b>";
      shown.slice(0, weightView.showAll ? undefined : 8).forEach(e => {
        const i = list.indexOf(e);
        const row = document.createElement("div");
        row.className = "spend-row weight-row";
        const text = document.createElement("span");
        text.innerHTML = `${shortDate(e.date)}${i > 0 ? ` · ${changeHtml(e.lbs - list[i - 1].lbs, list[i - 1].lbs)}` : ""}`;
        const amt = document.createElement("span");
        amt.textContent = lbs(e.lbs);
        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "link";
        edit.textContent = "Edit";
        edit.onclick = () => { weightView.editId = e.id; renderWeight(); document.getElementById("weightLbs").focus(); };
        const del = document.createElement("button");
        del.type = "button";
        del.className = "link danger";
        del.textContent = "✕";
        del.title = "Delete";
        del.onclick = () => {
          if (!confirm(`Delete the ${lbs(e.lbs)} weigh-in from ${shortDate(e.date)}?`)) return;
          weight.entries = weight.entries.filter(x => x.id !== e.id);
          if (weightView.editId === e.id) weightView.editId = null;
          saveWeight(`Deleted ${lbs(e.lbs)} weigh-in`); renderWeight();
        };
        row.append(text, amt, edit, del);
        wrap.append(row);
      });
      if (shown.length > 8) {
        const more = document.createElement("button");
        more.type = "button";
        more.className = "link";
        more.textContent = weightView.showAll ? "Show less" : `Show all ${shown.length}`;
        more.onclick = () => { weightView.showAll = !weightView.showAll; renderWeight(); };
        wrap.append(more);
      }
      document.getElementById("weightList").append(wrap);
    }
    // Weigh-ins can earn streak badges too.
    if (celebrated) checkCelebrations();
  }

  // ---- Spending ----
  // Personal spending only — prop-firm costs live in Trading and never count here.
  // Entries: { id, date, amount, category, note, source?: "import", importId?, billId? }.
  // Negative amounts are refunds and reduce totals.
  const SPEND_KEY = "habit-tracker-spending";
  const SPEND_COLOR = "#be123c";
  const CATEGORIES = ["Food", "Groceries", "Gas", "Shopping", "Bills", "Fun", "Other"];
  const BILL_FREQS = { weekly: "Weekly", monthly: "Monthly", yearly: "Yearly" };
  let spending = loadSpending();

  function uid() {
    return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function loadSpending() {
    let data;
    try { data = JSON.parse(localStorage.getItem(SPEND_KEY)); } catch {}
    const s = normalizeSpending(data);
    // Bills that came due while the app was closed get added now (no Undo toast for these).
    if (runRecurring(s)) { try { localStorage.setItem(SPEND_KEY, JSON.stringify(s)); } catch {} }
    return s;
  }
  // Fills in fields added after a save was made.
  function normalizeSpending(data) {
    const s = { budget: 0, entries: [], favorites: [], catLimits: {}, recurring: [], budgets: {}, ...(data || {}) };
    if (!s.started) s.started = s.entries.map(e => e.date).sort()[0] || dayKey(startOfToday());
    // Budgets are kept per month so past months are judged against the budget they had.
    if (s.budget && !Object.keys(s.budgets).length) s.budgets[dayKey(startOfToday()).slice(0, 7)] = s.budget;
    return s;
  }
  function saveSpending(label, mergeKey) {
    try { localStorage.setItem(SPEND_KEY, JSON.stringify(spending)); } catch {}
    commit(label, mergeKey);
  }

  const spentBetween = (from, to) =>
    spending.entries.filter(e => e.date >= from && e.date <= to).reduce((s, e) => s + e.amount, 0);
  const monthKeyOf = d => dayKey(d).slice(0, 7);
  const monthTotal = ym => spentBetween(`${ym}-01`, `${ym}-31`);
  const addMonths = (ym, n) => { const [y, m] = ym.split("-").map(Number); return monthKeyOf(new Date(y, m - 1 + n, 1)); };
  const monthLabel = (ym, opts = { month: "short" }) => fromKey(`${ym}-01`).toLocaleDateString(undefined, opts);
  // The budget in force for a month: the latest one set on or before it (or the earliest, for months before any).
  function budgetFor(ym) {
    const keys = Object.keys(spending.budgets).sort();
    if (!keys.length) return spending.budget || 0;
    const k = keys.filter(x => x <= ym).pop() || keys[0];
    return spending.budgets[k] || 0;
  }
  function categoryTotals(from, to) {
    const t = {};
    for (const e of spending.entries) if (e.date >= from && e.date <= to) t[e.category] = (t[e.category] || 0) + e.amount;
    return t;
  }

  // ---- Recurring bills ----
  // The nth due date of a bill (n = 0 is the start date). A monthly/yearly bill on the
  // 29th–31st lands on the last day of shorter months.
  function billDue(b, n) {
    const s = fromKey(b.start);
    if (b.freq === "weekly") return addDays(s, 7 * n);
    const y = s.getFullYear(), m = s.getMonth() + (b.freq === "yearly" ? 12 * n : n);
    return new Date(y, m, Math.min(s.getDate(), new Date(y, m + 1, 0).getDate()));
  }
  function nextBillDue(b, afterKey) {
    for (let n = 0; n < 5000; n++) {
      const d = billDue(b, n);
      if (dayKey(d) > afterKey) return d;
    }
    return null;
  }
  // Adds bill payments due up to today that haven't been added yet. Returns true if any were.
  function runRecurring(s) {
    const todayKey = dayKey(startOfToday());
    let added = false;
    for (const b of s.recurring) {
      if (b.paused) continue;
      // Start after the last payment added, and skip anything missed while paused.
      const after = [b.lastAdded, b.resumeFrom && dayKey(addDays(fromKey(b.resumeFrom), -1)), dayKey(addDays(fromKey(b.start), -1))]
        .filter(Boolean).sort().pop();
      for (let d = nextBillDue(b, after); d && dayKey(d) <= todayKey; d = nextBillDue(b, dayKey(d))) {
        // Same id on every device, so synced copies don't double up a bill payment.
        s.entries.push({ id: `bill-${b.id}-${dayKey(d)}`, date: dayKey(d), amount: b.amount, category: b.category, note: b.name, billId: b.id });
        b.lastAdded = dayKey(d);
        added = true;
      }
    }
    return added;
  }

  // ---- Spending streaks ----
  // Spending history starts at the first purchase or when spending tracking began, whichever is earlier.
  const spendStart = () => [spending.started, ...spending.entries.map(e => e.date)].sort()[0];
  // A no-spend day has no purchases other than recurring bills (refunds don't count as spending).
  const noSpendDay = key => !spending.entries.some(e => e.date === key && e.amount > 0 && !e.billId);
  // Finished days in a row with no spending; today is shown separately since it isn't over.
  function noSpendStreak() {
    let n = 0;
    for (let d = addDays(startOfToday(), -1); dayKey(d) >= spendStart(); d = addDays(d, -1)) {
      if (!noSpendDay(dayKey(d))) break;
      n++;
    }
    return n;
  }
  // Finished months in a row that ended at or under that month's budget.
  function underBudgetStreak() {
    let n = 0;
    for (let ym = addMonths(monthKeyOf(startOfToday()), -1); ym >= spendStart().slice(0, 7); ym = addMonths(ym, -1)) {
      const b = budgetFor(ym);
      if (!b || monthTotal(ym) > b) break;
      n++;
    }
    return n;
  }

  // View-only state for the spending card (not saved).
  const spendSection = { lastCat: null, showAll: false, editFavs: false, editBill: null, open: {} };

  function renderSpending() {
    const today = startOfToday();
    const todayKey = dayKey(today);
    const ym = todayKey.slice(0, 7);
    const monthStart = `${ym}-01`;
    const month = spentBetween(monthStart, todayKey);
    const budget = spending.budget;
    const sec = document.getElementById("spending");
    // <details> sections remember whether they were open across re-renders.
    const det = (id, title, body) => `<details class="spend-more" data-sec="${id}"${spendSection.open[id] ? " open" : ""}><summary>${title}</summary>${body}</details>`;
    sec.innerHTML = `
      <div class="habit">
        <div class="habit-top">
          <span class="dot" style="background:${SPEND_COLOR}"></span>
          <span class="name">Spending</span>
          <span class="streak">${money(month)} this month</span>
        </div>
        <div class="favs" id="spendFavs"></div>
        <form class="rate-row" id="spendForm">
          <label>$ <input type="number" id="spendAmount" step="0.01" inputmode="decimal" placeholder="0.00" required></label>
          <select id="spendCat"></select>
          <input type="text" id="spendNote" placeholder="What for? (optional)" maxlength="80" class="spend-note">
          <input type="date" id="spendDate">
          <button type="submit">Add</button>
          <button type="button" class="link" id="saveFav" title="Save category and note as a quick-add button">☆ Quick-add</button>
        </form>
        <div class="work-totals" id="spendTotals" style="margin-top:12px"></div>
        <div class="spend-streaks" id="spendStreaks"></div>
        <div class="rate-row">
          <label>Monthly budget $ <input type="number" id="spendBudget" min="0" step="1" placeholder="none"></label>
        </div>
        <div id="spendCats"></div>
        ${det("history", "📊 Last 12 months", `<div id="spendHistory"></div>`)}
        ${det("bills", `🔁 Recurring bills${spending.recurring.length ? ` (${spending.recurring.length})` : ""}`, `<div id="spendBills"></div>`)}
        ${det("limits", "🎯 Category limits", `<div id="spendLimits"></div>`)}
        <div id="spendList"></div>
        <div class="rate-row" style="margin-top:12px">
          <button type="button" id="csvBtn">📄 Import statement (CSV)</button>
          <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>
        </div>
      </div>`;
    sec.querySelectorAll("details.spend-more").forEach(d => d.ontoggle = () => { spendSection.open[d.dataset.sec] = d.open; });

    // Add form
    const cat = document.getElementById("spendCat");
    for (const c of CATEGORIES) cat.append(new Option(c));
    cat.value = spendSection.lastCat || "Food";
    const date = document.getElementById("spendDate");
    date.value = todayKey;
    date.max = todayKey;
    const amountIn = document.getElementById("spendAmount");
    const noteIn = document.getElementById("spendNote");
    document.getElementById("spendForm").onsubmit = e => {
      e.preventDefault();
      const amount = Math.round(parseFloat(amountIn.value) * 100) / 100;
      if (!amount) return;
      spendSection.lastCat = cat.value;
      spending.entries.push({ id: uid(), date: date.value || todayKey, amount, category: cat.value, note: noteIn.value.trim() });
      saveSpending(`${amount < 0 ? "Refund" : "Added"} ${money(Math.abs(amount))} ${cat.value}`); renderSpending();
      if (typeof render === "function") render(); // purchases can pre-answer habit questions
      document.getElementById("spendAmount").focus();
    };

    // Quick-add favorites: tap fills category and note, then you type the amount.
    const favs = document.getElementById("spendFavs");
    for (const f of spending.favorites) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "fav";
      b.textContent = (spendSection.editFavs ? "✕ " : "") + f.name;
      b.onclick = () => {
        if (spendSection.editFavs) {
          spending.favorites = spending.favorites.filter(x => x.id !== f.id);
          saveSpending(`Removed quick-add ${f.name}`); renderSpending(); return;
        }
        cat.value = f.category; noteIn.value = f.note || "";
        amountIn.value = ""; amountIn.focus();
        favs.querySelectorAll(".fav").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      };
      favs.append(b);
    }
    if (spending.favorites.length) {
      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "link";
      edit.textContent = spendSection.editFavs ? "Done" : "Edit";
      edit.onclick = () => { spendSection.editFavs = !spendSection.editFavs; renderSpending(); };
      favs.append(edit);
    }
    document.getElementById("saveFav").onclick = () => {
      const note = noteIn.value.trim();
      const name = prompt("Name for this quick-add button:", note || cat.value);
      if (!name || !name.trim()) return;
      spending.favorites.push({ id: uid(), name: name.trim(), category: cat.value, note });
      saveSpending(`Saved quick-add ${name.trim()}`); renderSpending();
    };

    // Budget
    const budgetIn = document.getElementById("spendBudget");
    if (budget) budgetIn.value = budget;
    budgetIn.onchange = () => {
      spending.budget = parseFloat(budgetIn.value) || 0;
      spending.budgets[ym] = spending.budget;
      saveSpending("Changed budget"); renderSpending();
    };

    // Totals, with a daily allowance from what's left of the budget.
    const daysLeft = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate() - today.getDate() + 1;
    const left = budget - month;
    const monthSub = budget
      ? (left >= 0 ? `${money(left)} left of ${money(budget)} · <b>${money(left / daysLeft)}/day left</b>`
        : `${money(-left)} over your ${money(budget)} budget`) : "";
    const totals = [
      ["Today", spentBetween(todayKey, todayKey), ""],
      ["Last 7 days", spentBetween(dayKey(addDays(today, -6)), todayKey), ""],
      ["This month", month, monthSub]
    ];
    document.getElementById("spendTotals").innerHTML = totals.map(([label, amt, sub]) =>
      `<div><b>${money(amt)}</b>${label}${sub ? `<br><span class="sub${left < 0 ? " over" : ""}">${sub}</span>` : ""}</div>`).join("");

    // Streaks
    const ns = noSpendStreak(), ub = underBudgetStreak();
    document.getElementById("spendStreaks").innerHTML =
      `<span>🟢 No-spend streak: <b>${ns} day${ns === 1 ? "" : "s"}</b>${noSpendDay(todayKey) ? " · nothing spent today so far" : ""}</span>` +
      (budget ? `<span>📅 Under budget: <b>${ub} month${ub === 1 ? "" : "s"}</b> in a row</span>` : "");

    // Budget bar, then categories (with optional limits), biggest first.
    const byCat = categoryTotals(monthStart, todayKey);
    for (const c of Object.keys(spending.catLimits)) if (!(c in byCat)) byCat[c] = 0;
    const cats = Object.entries(byCat).filter(([c, a]) => a || spending.catLimits[c]).sort((a, b) => b[1] - a[1]);
    let html = "";
    if (budget) {
      const pct = Math.min(Math.max(month, 0) / budget * 100, 100);
      html += `<div class="budget-bar"><i style="width:${pct}%;background:${month > budget ? "var(--danger)" : SPEND_COLOR}"></i></div>`;
    }
    if (cats.length) {
      const max = Math.max(...cats.map(([c, a]) => Math.max(a, spending.catLimits[c] || 0)), 1);
      html += `<div class="cat-list">` + cats.map(([c, amt]) => {
        const lim = spending.catLimits[c];
        const over = lim && amt > lim;
        const width = lim ? Math.min(Math.max(amt, 0) / lim * 100, 100) : Math.max(amt, 0) / max * 100;
        return `<div class="cat"><span>${c}</span><span class="cat-bar"><i style="width:${width}%;${over ? "background:var(--danger)" : ""}"></i></span>` +
          `<span${over ? ' class="over"' : ""}>${money(amt)}${lim ? ` of ${money(lim)}` : ""}</span></div>`;
      }).join("") + `</div>`;
    }
    document.getElementById("spendCats").innerHTML = html;

    renderSpendHistory(ym);
    renderBills();
    renderLimits();
    renderSpendList();

    document.getElementById("csvBtn").onclick = () => document.getElementById("csvFile").click();
    document.getElementById("csvFile").onchange = async e => {
      const file = e.target.files[0];
      e.target.value = "";
      if (file) openCsvPreview(await file.text());
    };
  }

  // Bar chart of the last 12 months, plus this month vs last month by category.
  function renderSpendHistory(ym) {
    const months = Array.from({ length: 12 }, (_, i) => addMonths(ym, i - 11));
    const totals = months.map(monthTotal);
    const max = Math.max(...totals, budgetFor(ym), 1);
    const W = 320, H = 130, B = 18, T = 14, bw = (W / 12) * 0.62;
    const bars = months.map((m, i) => {
      const x = (i + 0.5) * W / 12;
      const h = Math.max(totals[i], 0) / max * (H - B - T);
      const over = budgetFor(m) && totals[i] > budgetFor(m);
      return `<rect x="${(x - bw / 2).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"
          style="fill:${over ? "var(--danger)" : SPEND_COLOR};opacity:${m === ym ? 1 : 0.65}"><title>${monthLabel(m, { month: "long", year: "numeric" })}: ${money(totals[i])}</title></rect>
        <text x="${x.toFixed(1)}" y="${H - 5}" text-anchor="middle">${monthLabel(m, { month: "narrow" })}</text>`;
    }).join("");
    const b = budgetFor(ym);
    const budgetLine = b ? `<line x1="0" x2="${W}" y1="${(H - B - b / max * (H - B - T)).toFixed(1)}" y2="${(H - B - b / max * (H - B - T)).toFixed(1)}" style="stroke:var(--muted)" stroke-dasharray="3 3"/>` : "";
    const cur = totals[11], prev = totals[10], prevName = monthLabel(months[10], { month: "long" });
    const diff = cur - prev;
    let compare = `So far this month: <b>${money(cur)}</b> — ` +
      (Math.abs(diff) < 0.5 ? `about the same as ${prevName}` : `${money(Math.abs(diff))} ${diff < 0 ? "less" : "more"} than ${prevName}`);
    // Categories that moved the most vs last month.
    const a = categoryTotals(`${months[11]}-01`, `${months[11]}-31`), p = categoryTotals(`${months[10]}-01`, `${months[10]}-31`);
    const moves = [...new Set([...Object.keys(a), ...Object.keys(p)])]
      .map(c => [c, (a[c] || 0) - (p[c] || 0)]).filter(([, d]) => Math.abs(d) >= 1).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1])).slice(0, 4);
    const movesHtml = moves.length ? `<div class="moves">${moves.map(([c, d]) =>
      `<span style="color:${d > 0 ? "var(--danger)" : "var(--accent)"}">${c} ${d > 0 ? "▲" : "▼"} ${money(Math.abs(d))}</span>`).join("")}</div>` : "";
    document.getElementById("spendHistory").innerHTML =
      `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending per month">${budgetLine}${bars}</svg>` +
      `<div class="hint" style="margin:4px 0 0">${compare}</div>${movesHtml}`;
  }

      <select name="freq">${Object.entries(BILL_FREQS).map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select>
      <label>starting <input type="date" name="start" required></label>

      ${editing ? `<button type="button" class="link" id="billCancel">Cancel</button>` : ""}`;
    form.elements.category.value = editing?.category || "Bills";
    form.elements.freq.value = editing?.freq || "monthly";
    form.elements.start.value = editing?.start || todayKey;
    if (editing) { form.elements.name.value = editing.name; form.elements.amount.value = editing.amount; }
    form.onsubmit = e => {
